  const wtd = sst != null && sst24 != null ? sst - sst24 : null;
  const wt = water === 'tuzlu'
    ? (sst ?? clamp(airMean + 1.5, 5, 28))
    : clamp(airMean + ({dere:-2.5, nehir:-1, gol:0.5, baraj:0.5, lagun:1}[p.w] ?? 0), 3, 29);

  const date = time.slice(0, 10), D = S.F.daily, di = D.time.indexOf(date);
  const epoch = parseLocal(time, S.off) + 30 * 60000;
  const rise = parseLocal(D.sunrise[di], S.off), set = parseLocal(D.sunset[di], S.off);
  const tw = Math.min(Math.abs(epoch - rise), Math.abs(epoch - set)) <= 75 * 60000;
  const isDay = epoch > rise && epoch < set ? 1 : 0;
  const period = tw ? 'twilight' : (isDay ? 'day' : 'night');

  const wave = mv('wave_height'), wind = h.wind_speed_10m[i], windDir = h.wind_direction_10m[i];
  // Rüzgârın kıyıya göre yönü (p.lb = noktadan karaya doğru yön, bkz. landBearings): +1 denizden karaya (yem ve plankton
  // kıyıya yığılır, su biraz bulanır), −1 karadan denize (su açılır, balık açığa çekilir). Hafif rüzgârda (8 km/s altı)
  // ve kıyıdan uzak açık suda (3 km+) etkisi yok.
  const onshore = water === 'tuzlu' && p.lb != null && wind != null && windDir != null
    ? Math.cos((windDir - (p.lb + 180)) * Math.PI / 180) * clamp((wind - 8) / 12, 0, 1) * (p.shore == null ? 1 : clamp(1 - p.shore / 3000, 0, 1))
    : null;
  // Yağmurun suyu bulandırması bölgeye ve derinliğe bağlı: akıntılı Boğaz'da ve açık Karadeniz kıyısında az, sığ koylarda
  // tam; derin suda (12 m+) etkisi azalır. Eskiden her yerde aynıydı ve 6 mm yağmur Boğaz'ı da "bulanık" sayıyordu.
  const zone = water === 'tuzlu' ? seaZone(p.lat, p.lng) : null;
  const rainW = (zone === 'B' ? 0.3 : zone === 'K' ? 0.6 : 1) * (p.d ? clamp(12 / p.d, 0.35, 1) : 1);
  const turb = water === 'tuzlu'
    ? rain24 / 8 * rainW + (wave ?? 0) / 1.2 + (wind > 30 ? 0.4 : 0) + Math.max(0, onshore ?? 0) * 0.2
      + (salDrop != null && salDrop >= 1.5 ? 0.6 : 0) + (kd != null ? Math.max(0, (kd - 0.15) / 0.15) : 0)
    : rain24 / 6 * ((p.w === 'nehir' || p.w === 'dere') ? 2 : 1) + (wind > 30 ? 0.3 : 0);
  const mi = SunCalc.getMoonIllumination(new Date(epoch)), phase = mi.phase;
  // Gece ay ışığı (0 karanlık … 1 bulutsuz dolunay tepede): ay ufkun altındaysa ya da bulut kapatıyorsa karanlık
  const moonAlt = SunCalc.getMoonPosition(new Date(epoch), p.lat, p.lng).altitude;
  const moonLight = period === 'night' ? (moonAlt > 0.05 ? mi.fraction * Math.min(1, 0.4 + Math.sin(moonAlt)) * (1 - 0.8 * h.cloud_cover[i] / 100) : 0) : null;
  // Dalganın kıyıya göre yönü (+1 denizden kıyıya vuruyor): kıyıya vuran 30 cm+ dalga köpük hattı oluşturur
  const waveDir = mv('wave_direction');
  const waveOn = water === 'tuzlu' && p.lb != null && waveDir != null && wave != null && wave >= 0.3
    ? Math.cos((waveDir - (p.lb + 180)) * Math.PI / 180) : null;
  // Akıntı: model ~8 km çözünürlükte, kıyıda mutlak değeri kaba (Boğaz'ı olduğundan zayıf, körfezi tek hücre gösterir).
  // Bu yüzden noktanın 8 günlük medyanına oranı kullanılır: "bugün akıntı olağanın 2 katı" bilgisi mutlak değerden güvenilir.
  // Copernicus modeli varsa o kullanılır (Marmara 500 m: Boğaz ve körfez akıntısı ayrıntılı, cm/s → km/s)
  const curM = dv('c') != null ? dv('c') * 0.036 : null;
  const cur = curM ?? mv('ocean_current_velocity');
  if (S.curMed === undefined) {
    const v = ((mh && mh.ocean_current_velocity) || []).filter(x => x != null).sort((a, b) => a - b);
    S.curMed = v.length ? v[v.length >> 1] : null;
  }
  const curMed = curM != null ? (dz.cMed != null ? dz.cMed * 0.036 : null) : S.curMed;
  const curRel = cur != null && curMed >= 0.15 ? cur / curMed : null;

  return {
    i, time, epoch, water, hab:p.w, sea: water === 'tuzlu' ? detectSea(p.lat, p.lng) : null, zone,
    temp:h.temperature_2m[i], precip:h.precipitation[i], cloud:h.cloud_cover[i],
    pressure:h.pressure_msl[i], ptrend: i >= 3 ? h.pressure_msl[i] - h.pressure_msl[i-3] : null,
    ptrend12: i >= 12 ? h.pressure_msl[i] - h.pressure_msl[i-12] : null,
    wind, windDir, onshore, gust:h.wind_gusts_10m[i], code:h.weather_code[i], isDay,
    rain24, period, sunrise:D.sunrise[di], sunset:D.sunset[di],
    sst, wt, wtd, wave, waveDir, waveOn, moonLight, wavePer:mv('wave_period'),
    bottom: water === 'tuzlu' ? bottomOf(p) : null,
    cur, curRel, curDir: curM != null ? dv('cd') : mv('ocean_current_direction'),
    model: dz ? (dz.src === 'mrm' ? 'Copernicus Marmara modeli (500 m)' : 'Copernicus Karadeniz modeli (2,5 km)') + (dz.tb != null ? ' · uydu düzeltmeli' : '') : null,
    sstModel: sstM != null, sal, salDrop, o2, kd, gfw: water === 'tuzlu' ? gfwNear(p) : null,
    chl: water === 'tuzlu' && p.chl ? p.chl.v : null,
    chlRise: water === 'tuzlu' && p.chl && p.chl.v7 ? p.chl.v / p.chl.v7 : null, chlDay: p.chl ? p.chl.t : null,
    // Kıyı noktalarında genel 6 m varsayımı yerine nokta tipine göre derinlik (mendirek 10, kumsal 4, ağız 3)
    depth: water === 'tuzlu' ? (!p.custom && D_SEED[p.n] ? D_SEED[p.n][0]
      : (p.d == null || (p.d === 6 && !p.custom)) ? (KIND_DEPTH[spotKind(p)] ?? p.d ?? 8) : p.d) : null,
    depthShore: water === 'tuzlu' && !p.custom && NAV_DEPTH[p.n] ? NAV_DEPTH[p.n][0] : null,
    murky: turb >= 1, month: +time.slice(5, 7), mmdd: time.slice(5, 10),
    moonPhase: phase, moonIll: Math.round(mi.fraction * 100),
    moonStrong: phase < 0.08 || phase > 0.92 || Math.abs(phase - 0.5) < 0.08,
  };
}

const moonName = ph => ph < .05 || ph > .95 ? '🌑 Yeni Ay' : ph < .22 ? '🌒 Hilal' : ph < .28 ? '🌓 İlk Dördün' : ph < .45 ? '🌔 Şişkin Ay' :
  ph < .55 ? '🌕 Dolunay' : ph < .72 ? '🌖 Şişkin Ay' : ph < .78 ? '🌗 Son Dördün' : '🌘 Hilal';

// Solunar: ayın tepe/dip geçişleri (major ±1 sa) ve doğuş/batışı (minor ±30 dk)
function solunar(S, date){
  if (S.sol[date]) return S.sol[date];
  const start = parseLocal(date + 'T00:00', S.off), step = 10 * 60000;
  const alt = [];
  for (let t = start - 2*3600000; t <= start + 26*3600000; t += step)
    alt.push([t, SunCalc.getMoonPosition(new Date(t), S.p.lat, S.p.lng).altitude]);
  const majors = [], minors = [];
  for (let k = 1; k < alt.length - 1; k++) {
    const [t, a] = alt[k];
    if (a > alt[k-1][1] && a >= alt[k+1][1]) majors.push(t);
    if (a < alt[k-1][1] && a <= alt[k+1][1]) majors.push(t);
    if ((alt[k-1][1] < 0) !== (a < 0)) minors.push(t);
  }
  return S.sol[date] = {majors, minors};
}
// Solunar tablosu için bir günün ay olayları: doğuş, batış, tepe (üst geçiş), alt geçiş + periyotlar ve gün puanı.
// Periyot genişlikleri puanlamayla aynı: büyük ±1 sa, küçük ±36 dk.
function solunarDay(S, date){
  const start = parseLocal(date + 'T00:00', S.off), end = start + 86400000, step = 10 * 60000;
  const alt = t => SunCalc.getMoonPosition(new Date(t), S.p.lat, S.p.lng).altitude;
  const ev = {rise:null, set:null, over:null, under:null};
  let pa = alt(start - step), a = alt(start);
  for (let t = start; t < end; t += step) {
    const na = alt(t + step);
    if (pa < 0 && a >= 0 && ev.rise == null) ev.rise = t;
    if (pa >= 0 && a < 0 && ev.set == null) ev.set = t;
    if (a > pa && a >= na && ev.over == null) ev.over = t;
    if (a < pa && a <= na && ev.under == null) ev.under = t;
    pa = a; a = na;
  }
  const H = 3600000, majors = [ev.over, ev.under].filter(Boolean).map(t => [t - H, t + H]).sort((x, y) => x[0] - y[0]);
  const minors = [ev.rise, ev.set].filter(Boolean).map(t => [t - 0.6 * H, t + 0.6 * H]).sort((x, y) => x[0] - y[0]);
  const noon = new Date(start + 12 * H), ill = SunCalc.getMoonIllumination(noon), ph = ill.phase;
  // Gün puanı (1–5 ★), klasik solunar tablolarındaki etkenler:
  //  • Ay evresi (%50): yeniay ve dolunay en güçlü, dördün (yarım ay) en zayıf — sürekli: (1 + cos 4π·evre) / 2
  //  • Denk gelme (%30): büyük periyot gün doğumu/batımına ±1 sa denk gelirse 1, sadece küçük periyot gelirse 0,5
  //  • Ayın yakınlığı (%20): ay Dünya'ya yakınken (perigee ~357 bin km) gelgit/akıntı güçlü, uzakken (~406 bin km) zayıf
  const times = SunCalc.getTimes(noon, S.p.lat, S.p.lng);
  const twi = [times.sunrise.getTime(), times.sunset.getTime()];
  const hits = list => list.some(([a1, b1]) => twi.some(t => t >= a1 - H && t <= b1 + H));
  const phaseF = (1 + Math.cos(4 * Math.PI * ph)) / 2;
  const overlap = hits(majors) ? 1 : hits(minors) ? 0.5 : 0;
  const dist = SunCalc.getMoonPosition(noon, S.p.lat, S.p.lng).distance;
  const distF = clamp((406000 - dist) / (406000 - 357000), 0, 1);
  const moon = 0.5 * phaseF + 0.3 * overlap + 0.2 * distF;
  // Olumlu / olumsuz şartlar: ay etkenleri + o günün hava tahmini (fırtına, rüzgâr, yağış, dalga, tahmin belirsizliği)
  const pos = [], neg = [];
  if (phaseF >= 0.6) pos.push(`güçlü ay evresi (%${Math.round(phaseF * 100)})`); else if (phaseF < 0.3) neg.push(`zayıf ay evresi – yarım ay (%${Math.round(phaseF * 100)})`);
  if (overlap === 1) pos.push('ay geçişi şafak/akşama denk'); else if (overlap) pos.push('ay doğuş/batışı şafak/akşama denk'); else neg.push('ay periyotları şafak/akşama denk gelmiyor');
  if (distF >= 0.6) pos.push('ay yakın – güçlü akıntı'); else if (distF < 0.25) neg.push('ay uzak – zayıf akıntı');
  let adj = 0;
  const h = S.F && S.F.hourly, idx = h ? h.time.map((t, k) => t.startsWith(date) ? k : -1).filter(k => k >= 0) : [];
  if (idx.length) {
    const mh = S.M && S.M.hourly, wave = k => { const j = S.mIdx && S.mIdx.get(h.time[k]); return mh && j != null && mh.wave_height ? mh.wave_height[j] : null; };
    const storm = idx.filter(k => h.weather_code[k] >= 95).length;
    const wind = Math.max(...idx.map(k => h.wind_speed_10m[k])), gust = Math.max(...idx.map(k => h.wind_gusts_10m[k]));
    const rain = idx.reduce((a, k) => a + (h.precipitation[k] || 0), 0);
    const waves = idx.map(wave).filter(x => x != null), wmax = waves.length ? Math.max(...waves) : null;
    const pdrop = idx.some(k => k >= 3 && h.pressure_msl[k] - h.pressure_msl[k - 3] <= -1);
    const calm = wind <= 20 && rain < 1 && !storm;
    if (storm) { adj -= storm >= 3 ? 0.3 : 0.15; neg.push(`gök gürültülü fırtına (${storm} saat)`); }
    if (wind > 40 || gust > 55) { adj -= 0.25; neg.push(`fırtına rüzgârı (${Math.round(wind)} km/s)`); }
    else if (wind > 30 || gust > 45) { adj -= 0.12; neg.push(`sert rüzgâr (${Math.round(wind)} km/s)`); }
    if (rain > 10) { adj -= 0.12; neg.push(`kuvvetli yağış (${rain.toFixed(0)} mm)`); }
    else if (rain > 4) { adj -= 0.06; neg.push(`yağışlı (${rain.toFixed(0)} mm)`); }
    if (wmax != null && wmax > 2) { adj -= 0.15; neg.push(`yüksek dalga (${wmax.toFixed(1)} m)`); }
    else if (wmax != null && wmax > 1.5) { adj -= 0.07; neg.push(`dalgalı (${wmax.toFixed(1)} m)`); }
    if (pdrop && !storm) { adj += 0.05; pos.push('düşen basınç – iştah artar'); }
    if (calm) { adj += 0.05; pos.push('sakin hava'); }
    const ahead = Math.round((parseLocal(date + 'T00:00', S.off) - parseLocal(h.time[S.nowIdx].slice(0, 10) + 'T00:00', S.off)) / 86400000);
    if (ahead >= 4) { adj -= 0.04 * (ahead - 3); neg.push(`${ahead}. gün – tahmin belirsiz`); }
  }
  const score = clamp(moon + adj, 0, 1);
  return {ev, majors, minors, phase:ph, ill:Math.round(ill.fraction * 100), moon, score, phaseF, overlap, distF, dist, pos, neg,
    stars: score >= 0.72 ? 5 : score >= 0.6 ? 4 : score >= 0.45 ? 3 : score >= 0.3 ? 2 : 1};
}
const tHM = t => t == null ? '—' : new Date(t).toLocaleTimeString('tr-TR', {timeZone:'Europe/Istanbul', hour:'2-digit', minute:'2-digit'});
const tSpan = ([a, b]) => `${tHM(a)}–${tHM(b)}`;

function solunarTableHtml(S, dates){
  const rows = dates.map(d => {
    const s = solunarDay(S, d);
    return `<tr><td><b>${dayLabel(d + 'T00')}</b></td>
      <td>${moonName(s.phase).split(' ')[0]} %${s.ill}</td>
      <td>↑${tHM(s.ev.rise)}<br>↓${tHM(s.ev.set)}</td>
      <td class="maj">${s.majors.map(tSpan).join('<br>') || '—'}</td>
      <td>${s.minors.map(tSpan).join('<br>') || '—'}</td>
      <td style="min-width:170px;white-space:normal"><span style="color:#f2c14e;white-space:nowrap">${'★'.repeat(s.stars)}</span><span style="color:var(--line)">${'★'.repeat(5 - s.stars)}</span>
        <span class="sub"> ${Math.round(s.score * 100)}${Math.round(s.score * 100) !== Math.round(s.moon * 100) ? ` (ay ${Math.round(s.moon * 100)})` : ''}</span><br>
        ${s.pos.length ? `<span class="sub" style="color:#4caf7a">✓ ${s.pos.join(' · ')}</span><br>` : ''}
        ${s.neg.length ? `<span class="sub" style="color:#e06c5a">✗ ${s.neg.join(' · ')}</span>` : ''}</td></tr>`;
  }).join('');
  return `<details class="card solunar" open><summary><h2 style="display:inline">🌙 Solunar tablosu · ${S.p.n}</h2></summary>
    <div class="tw"><table>
      <tr><th>Gün</th><th>Ay</th><th>Ay doğuş/batış</th><th>Büyük periyot</th><th>Küçük periyot</th><th>Gün</th></tr>${rows}
    </table></div>
    <p class="note" style="margin:8px 0 0">Büyük periyot: ay tepedeyken ve tam altındayken (~2 saat). Küçük periyot: ay doğarken ve batarken (~1 saat).
      Bu saatlerde balıkların daha aktif olduğu kabul edilir; saatlik puanlara zaten dahildir.<br>
      <b>Gün puanı (0–100 → ★–★★★★★):</b> ay evresi %50 (yeniay/dolunay en güçlü, yarım ay en zayıf) · büyük periyodun gün doğumu/batımına
      denk gelmesi %30 · ayın Dünya'ya yakınlığı %20 (yakın ay = güçlü gelgit ve akıntı). Bu ay puanına o günün havası eklenir:
      <span style="color:#4caf7a">✓ olumlu şartlar</span> (sakin hava, düşen basınç) puanı artırır, <span style="color:#e06c5a">✗ olumsuz şartlar</span>
      (fırtına, sert rüzgâr, kuvvetli yağış, yüksek dalga, 4. günden sonraki belirsiz tahmin) düşürür. Saatler Türkiye saatidir.</p></details>`;
}

function solunarFactor(S, e){
  const s = solunar(S, e.time.slice(0, 10));
  let f = 1, label = '';
  for (const t of s.majors) {
    const dt = Math.abs(e.epoch - t) / 3600000;
    if (dt <= 1 && f < 1.22) { f = 1.22; label = 'Ay geçişi (major solunar)'; }
    else if (dt <= 1.6 && f < 1.08) { f = 1.08; label = 'Ay geçişine yakın'; }
  }
  for (const t of s.minors) {
    if (Math.abs(e.epoch - t) / 3600000 <= 0.6 && f < 1.12) { f = 1.12; label = 'Ay doğuşu/batışı (minor solunar)'; }
  }
  if (f > 1 && e.moonStrong) f += 0.04;
  return {f, label};
}

// =====================================================================
//  TAHMİN MOTORU
// =====================================================================
const HUNTERS = ['palamut', 'lufer', 'kolyoz'];
const LIGHT_FISH = ['istavrit', 'kalamar', 'mezgit'], SURF_FISH = ['levrek', 'karagoz', 'sargoz', 'cupra', 'minekop'];
function scoreFish(f, e, spot){
  if (f.water !== e.water) return null;
  if (f.water === 'tatli' && !f.hab.includes(e.hab)) return null;
  if (f.water === 'tuzlu' && e.sea && !f.seas.includes(e.sea)) return null;
  const why = [];
  let s = 1;
  const t = e.wt, [tmin, lo, hi, tmax] = f.t;
  if (t < tmin || t > tmax) { s *= 0.05; why.push(`su ${t.toFixed(1)}°C – tolerans dışı`); }
  else if (t >= lo && t <= hi) why.push(`su sıcaklığı ideal (${lo}–${hi}°C)`);
  else if (t < lo) { s *= 0.35 + 0.65*(t - tmin)/(lo - tmin); why.push('su biraz soğuk'); }
  else { s *= 0.35 + 0.65*(tmax - t)/(tmax - hi); why.push('su biraz sıcak'); }

  // Sezonun hemen öncesi/sonrası ayı yumuşak geçer: eskiden ay değişince puan bir gecede yarıya iniyordu (mırmır 31 Eki 48 →
  // 1 Kas 18; oysa 31 Eki'de trofe mırmır tutuldu). Ayın bolluğu (ABUND) azalmayı ayrıca yansıtıyor.
  const near = m => f.months.includes(((e.month + m + 11) % 12) + 1);
  if (f.months.includes(e.month)) why.push('mevsimi');
  else if (near(-1) || near(1)) { s *= 0.75; why.push(near(-1) ? 'mevsim sonu' : 'mevsim başı'); }
  else { s *= 0.45; why.push('mevsim dışı'); }
  // Bolluk (bölge × ay): sezon zirvesindeki bol tür ×1,10'a kadar çıkar, o bölgede/ayda az bulunan tür ×0,5'e kadar iner
  const A = f.water === 'tuzlu' && e.zone && ABUND[f.id];
  if (A) {
    const a = A.z[e.zone] * A.m[e.month - 1];
    s *= 0.45 + 0.65 * a;
    const where = `${ZONE_TR[e.zone]}, ${MONTH_FULL[e.month - 1]}`;
    if (a >= 0.75) why.push(`bol dönemi (${where})`);
    else if (a < 0.3) why.push(`az bulunur (${where})`);
  }

  // Yüzey avcıları (palamut, lüfer, kolyoz) karanlıkta ve alacakaranlıkta yem sürüsünü kıyıya sıkıştırır: 4 m'lik sakin
  // suda da avlanır (Yarımca, 1 Kas sabahı: çarşaf denizde kıyı dibinde torik). Bu saatlerde sığ ve durgun su cezası kalkar.
  const hunt = HUNTERS.includes(f.id) && e.period !== 'day';
  if (f.water === 'tuzlu') {
    if (e.depth != null) {
      // f.d = yaşayabildiği aralık, DOPT = en çok bulunduğu (ideal) derinlik bandı
      // Yüzey balıkları (kefal, zargana) kıyı boyunca yüzeyde dolaşır: döküm noktasının dibi değil kıyının derinliği sayılır
      const kind = INFO[f.id] && INFO[f.id].kind;
      const [dmin, dmax] = hunt ? [Math.min(f.d[0], 2), f.d[1]] : f.d;
      const dd = kind === 'yuzey' && e.depthShore != null ? Math.min(e.depthShore, e.depth) : e.depth;
      let [olo, ohi] = DOPT[f.id] || f.d, when = '';
      // Gün içi dikey göç: avcı/sürü balıkları gece ve alacakaranlıkta sığa çıkar, parlak gündüzde derine iner
      if (['pelajik', 'pusu', 'kalamar'].includes(kind)) {
        const sh = e.period !== 'day' ? 0.6 : (e.cloud < 50 && !e.murky ? 1.4 : 1);
        if (sh !== 1) {
          olo = Math.max(0, Math.round(olo * sh)); ohi = Math.min(dmax, Math.round(ohi * sh));
          when = sh < 1 ? (e.period === 'night' ? 'gece sığa çıkar, ' : 'alacakaranlıkta sığa çıkar, ') : 'parlak gündüz derine iner, ';
        }
      }
      if (hunt) { olo = Math.min(olo, 3); when = 'yem sürüsünü kıyıya sıkıştırır, '; }
      // Aralık dışı, "biraz sığ/derin" bandının kenarındaki ×0,75'ten devam eder: eskiden sınırın hemen dışı (×~1) sınırın
      // hemen içinden (×0,75) yüksek çıkıyordu (kalamar 3,9 m'de 72, 4 m'de 56)
      if (dd < dmin) { s *= 0.75 * Math.max(0.33, dd / dmin); why.push(`çok sığ (${dd < 10 ? dd.toFixed(1).replace('.0', '') : Math.round(dd)} m)`); }
      else if (dd > dmax) { s *= 0.75 * Math.max(0.16, dmax / dd); why.push(`çok derin (${Math.round(dd)} m)`); }
      else if (dd < olo) { s *= 0.75 + 0.25 * (dd - dmin) / Math.max(olo - dmin, 1); why.push(`${when}biraz sığ (şu an ideal ${olo}–${ohi} m)`); }
      else if (dd > ohi) { s *= 0.75 + 0.25 * (dmax - dd) / Math.max(dmax - ohi, 1); why.push(`${when}biraz derin (şu an ideal ${olo}–${ohi} m)`); }
      else {
        // Band içinde de ortası en iyi (logaritmik ölçek), kenarlara doğru en fazla %7 düşüş
        const lo = Math.max(olo, 1), hi = Math.max(ohi, lo + 1), c = Math.sqrt(lo * hi);
        const t = Math.min(1, Math.abs(Math.log(Math.max(dd, 0.5)) - Math.log(c)) / Math.log(hi / c));
        s *= 1 - 0.07 * t * t;
        why.push(`${when}derinlik uygun (şu an ideal ${olo}–${ohi} m)`);
      }
    }
    if (e.wave != null) {
      const [wlo, whi] = hunt ? [0, f.w[1]] : f.w;
      const dist = e.wave < wlo ? wlo - e.wave : e.wave > whi ? e.wave - whi : 0;
      s *= 1 - Math.min(0.6, dist * 0.5);
      if (dist === 0 && wlo > 0) why.push('dalga hareketi işine yarar');
      if (dist > 0.5) why.push(e.wave > whi ? 'dalga fazla' : 'deniz fazla durgun');
    }
    // Akıntı (meranın olağanına göre): artan akıntı yemi sürükler, avcı ve sürü balıkları burun ve iskele uçlarında
    // toplanır; durgun suda dağınık kalır. Çok kuvvetli akıntıda dip takımı yerinde durmaz.
    if (e.curRel != null) {
      const kind = INFO[f.id] && INFO[f.id].kind;
      if (kind === 'pelajik' || kind === 'pusu') {
        if (e.curRel >= 1.5 && e.cur >= 0.3) { s *= 1.06; why.push('akıntı olağandan güçlü – yem sürüklenir'); }
        else if (e.curRel <= 0.35) { s *= 0.95; why.push('akıntı durgun'); }
      } else if (kind === 'dip' && e.cur >= 2) { s *= 0.9; why.push('akıntı çok kuvvetli – dip takımı tutmaz'); }
    }
    // Yakında son hafta yoğun gırgır avı: sürü bölgede (GFW, 12 km). 25+ saat ×1,04, 100+ saat ×1,08
    if (e.gfw && e.gfw.h >= 25 && GIRGIR_FISH.includes(f.id)) {
      s *= e.gfw.h >= 100 ? 1.08 : 1.04; why.push(`son hafta yakında gırgır avı (${e.gfw.n} tekne, ${e.gfw.h} saat) – sürü bölgede`);
    }
    // Oksijen (Karadeniz modeli): yüzeyde 180 mmol/m³ altı nadirdir; olursa balık bölgeyi terk eder ya da durgunlaşır
    if (e.o2 != null && e.o2 < 180) { s *= 0.85; why.push(`oksijen düşük (${e.o2} mmol/m³)`); }
    // Klorofil (uydu, 1–2 gün önce): artan plankton yem balığını (hamsi, istavrit yavrusu) toplar, avcılar peşinden gelir.
    // Çok yüksek değer (8+ mg/m³) çiçeklenme demek: su bulanık, gece oksijen düşebilir; berrak su seven tür çekinir.
    // Günlük avla bağı dolaylı olduğundan etkisi küçük tutuldu (±%4–8).
    if (e.chl != null) {
      const kind = INFO[f.id] && INFO[f.id].kind;
      if (e.chl >= 8) { if (f.murky === -1) { s *= 0.92; why.push(`yoğun plankton (${e.chl.toFixed(0)} mg/m³) – su bulanık`); } }
      else if (e.chlRise != null && e.chlRise >= 1.5 && e.chl >= 1 && (kind === 'pelajik' || kind === 'pusu')) { s *= 1.04; why.push('plankton artıyor – yem balığı toplanır'); }
    }
  } else {
    if (e.wind >= 6 && e.wind <= 22) { s *= 1.05; why.push('hafif rüzgâr suyu karıştırıyor'); }
  }
  // Bulanıklık etkisi yumuşatıldı (±%25 sıralamayı tek başına tersine çeviriyordu): avantaj ×1,08, dezavantaj ×0,88
  if (f.murky === 1 && e.murky) { s *= 1.08; why.push('bulanık su avantaj'); }
  if (f.murky === -1 && e.murky) { s *= 0.88; why.push('bulanık su dezavantaj'); }
  if (f.murky === -1 && !e.murky) s *= 1.04;

  if (f.best.includes(e.period)) { s *= 1.12; why.push({twilight:'alacakaranlık – av saati', night:'gece aktif', day:'gündüz aktif'}[e.period]); }
  else s *= 0.85;
  // Gece ay ışığı: ışığa toplanan türler (istavrit, kalamar, mezgit) karanlık gecede iskele ve sokak ışığı altına yığılır;
  // parlak dolunayda tüm denize dağılır
  if (e.moonLight != null && LIGHT_FISH.includes(f.id)) {
    if (e.moonLight < 0.15) { s *= 1.06; why.push('karanlık gece – ışıklı merada toplanır'); }
    else if (e.moonLight > 0.6) { s *= 0.92; why.push('parlak ay ışığı – sürü dağılır'); }
  }
  // Dip yapısı: türün sevdiği dipte artı, sevmediğinde eksi; tahminin güvenine (w) göre ölçeklenir
  const bp = e.bottom && BOTTOM_PREF[f.id] && BOTTOM_PREF[f.id][e.bottom.t];
  if (bp && bp !== 1) {
    s *= 1 + (bp - 1) * e.bottom.w;
    if (Math.abs(bp - 1) >= 0.05) why.push(`${BOTTOM_TR[e.bottom.t]} dip – ${bp > 1 ? 'sever' : 'pek sevmez'}`);
  }
  // Kıyıya vuran dalga köpük hattı oluşturur: levrek, karagöz, sargoz, çipura, minekop orada sürüklenen yemi bekler
  if (e.waveOn != null && e.waveOn >= 0.5 && e.wave <= 1.5 && SURF_FISH.includes(f.id)) { s *= 1.06; why.push('dalga kıyıya vuruyor – köpük hattı'); }

  if (e.ptrend != null) {
    if (e.ptrend <= -1) { s *= 1.1; why.push('düşen basınç – iştah artar'); }
    else if (e.ptrend >= 2) { s *= 0.88; why.push('hızlı yükselen basınç'); }
  }
  // Kayıtlı meralara (bilinen tür, iskele/kumsal tipi, Google popülerliği) ek puan verilmez: haritadaki bilinmeyen
  // meralar aynı koşullarda aynı puanı almalı. Puan yalnız su, hava, saat, derinlik ve mevsimden gelir.
  // Yumuşak doygunluk: ideal koşullar ~70–85, mükemmel ~90+
  // Doğrusal ölçek (koşulların %10'luk farkı puana da ~%10 yansır); ideal koşul ~62, her şey çok uygunsa 85+
  return {fish:f, score: clamp(Math.round(62 * s), 0, 99), why};
}

function rankFor(e, spot){
  const list = [], banned = [];
  for (const f of ALL_FISH) {
    const r = scoreFish(f, e, spot);
    if (!r) continue;
    if (inBan(f, e.mmdd)) banned.push(f); else list.push(r);
  }
  list.sort((a, b) => b.score - a.score);
  return {list, banned};
}

// Bir saatin genel verimlilik puanı
function hourScore(S, i){
  const e = envAt(S, i), {list, banned} = rankFor(e, S.p);
  const top = list.slice(0, 3);
  const sol = solunarFactor(S, e);
  let m = sol.f;
  // Olumlu (✓) ve olumsuz (✗) şartlar ayrı tutulur; olumsuzlar puanı çarpanla düşürür
  const pos = [], neg = [];
  if (sol.label) pos.push(sol.label);
  // Günün saati: alacakaranlık burada ayrıca çarpılmaz — her türün kendi aktif saati (scoreFish: best ×1,12 / değilse ×0,85)
  // bunu zaten hesaba katar; ikinci kez çarpmak alacakaranlık balıklarını iki kez ödüllendiriyordu. Not bilgi olarak kalır.
  // Güneşli-berrak öğlende balıklar derine çekilir.
  const hr = +e.time.slice(11, 13);
  if (e.period === 'twilight') pos.push('alacakaranlık beslenme saati');
  else if (e.period === 'day' && hr >= 11 && hr <= 15 && e.cloud < 50 && !e.murky) { m *= 0.8; neg.push('güneşli öğle – balık derinde'); }
  // Gece yarısı sonrası: gece beslenen türler (lüfer, istavrit…) öndeyse durgun saat sayılmaz. İzmit'te balıkçılar 02–06'yı
  // "balığın kıyıladığı saatler" diye anlatıyor (1 Kas: Yarımca'da 02–06 arası palamut/çinekop); sabaha karşı hafif artı.
  else if (e.period === 'night' && hr >= 1 && hr <= 5) {
    const nightFeed = top.some(r => r.fish.best.includes('night'));
    if (!nightFeed && hr <= 3) { m *= 0.9; neg.push('gece yarısı sonrası – durgun saat'); }
    else if (nightFeed && hr >= 4) { m *= 1.06; pos.push('sabaha karşı – balık kıyıya yanaşır'); }
  }
  if (e.ptrend != null && e.ptrend <= -1) pos.push('düşen basınç');
  // Uzun basınç eğilimi (12 sa): 3 saatlik pencere yavaş ama sürekli düşüşü kaçırıyordu ("1028'den 1023'e düşerken
  // yanaştılar", lrfizmit 4 Eki). Son 3 saatte zaten düşüyorsa (türe ×1,10 verildi) burada tekrar sayılmaz.
  if (e.ptrend12 != null && e.ptrend12 <= -3 && !(e.ptrend != null && e.ptrend <= -1)) { m *= 1.05; pos.push(`basınç 12 saattir düşüyor (${e.ptrend12.toFixed(0)} hPa)`); }
  else if (e.ptrend12 != null && e.ptrend12 >= 5) { m *= 0.94; neg.push(`basınç 12 saatte hızla yükseldi (+${e.ptrend12.toFixed(0)} hPa, cephe sonrası)`); }
  // Su sıcaklığının 24 saatteki değişimi: ani soğuma balığı durgunlaştırır, ılık su girişi hareketlendirir
  if (e.water === 'tuzlu' && e.wtd != null) {
    if (e.wtd <= -1) { m *= Math.max(0.85, 1 + 0.07 * e.wtd); neg.push(`su 1 günde ${(-e.wtd).toFixed(1)}°C soğudu`); }
    else if (e.wtd >= 0.8) { m *= 1.04; pos.push(`su 1 günde ${e.wtd.toFixed(1)}°C ısındı`); }
  }
  // Rüzgâr yönü (İzmit'te balıkçıların takip ettiği ölçüt): kıyıya esen rüzgâr en fazla +%8, karadan esen en fazla −%6
  if (e.onshore != null && e.onshore >= 0.3) { m *= 1 + 0.08 * e.onshore; pos.push(`kıyıya esen rüzgâr (${dirName(e.windDir)}) – yem kıyıya yığılır`); }
  else if (e.onshore != null && e.onshore <= -0.3) { m *= 1 + 0.06 * e.onshore; neg.push(`karadan esen rüzgâr (${dirName(e.windDir)}) – balık açığa çekilir`); }
  if (e.wind > 40 || e.gust > 55) { m *= 0.45; neg.push('fırtına rüzgârı'); }
  else if (e.wind > 30 || e.gust > 45) { m *= 0.7; neg.push('sert rüzgâr'); }
  else if (e.wind > 25 || e.gust > 38) { m *= 0.88; neg.push('rüzgârlı – döküm zor'); }
  const h = S.F.hourly;
  if (e.code >= 95) { m *= 0.3; neg.push('gök gürültülü fırtına – dışarı çıkma'); }
  else {
    // Fırtınadan hemen önce/sonra (±2 sa): su ve hava hâlâ tehlikeli, balık da dağınık
    let near = 99;
    for (let d = 1; d <= 2; d++) for (const k of [i - d, i + d]) if (h.weather_code[k] >= 95) near = Math.min(near, d);
    if (near === 1) { m *= 0.7; neg.push('fırtınanın hemen öncesi/sonrası'); }
    else if (near === 2) { m *= 0.85; neg.push('fırtınaya yakın saat'); }
    if (e.precip > 4) { m *= 0.7; neg.push('kuvvetli yağış'); }
  }
  if (e.water === 'tuzlu' && e.wave != null && e.wave > 2) { m *= 0.6; neg.push('yüksek dalga'); }
  else if (e.water === 'tuzlu' && e.wave != null && e.wave > 1.5) { m *= 0.85; neg.push('dalgalı'); }
  // Tahmin belirsizliği: 4. günden sonra her gün %4 kırpılır (uzak tahminler en üste çıkmasın)
  const ahead = Math.round((Date.parse(e.time.slice(0, 10)) - Date.parse(h.time[S.nowIdx].slice(0, 10))) / 86400000);
  if (ahead >= 4) { m *= 1 - 0.04 * (ahead - 3); neg.push(`${ahead}. gün – tahmin belirsiz`); }
  const notes = [...pos, ...neg.map(x => '✗ ' + x)];
  // adj: türün kendi puanı × bu saatin rüzgâr/yağış/ay/saat etkisi (hedef balık filtresinde kullanılır)
  // Yumuşak doygunluk: en iyi koşullar ~85–90, sıradan saatler ~55–65 (sıralama 99'da yığılmasın)
  // Tür puanı × saat etkisi; ikinci kez sıkıştırmadan (yoksa derinlik/yer farkları ezilir), sadece üstten sınırlı
  list.forEach(r => r.adj = clamp(Math.round(r.score * Math.pow(m, 0.85) * 0.85), 0, 99));
  // Genel puan = listede gösterilen ilk 3 türün bu saatteki puan ortalaması (iki ölçek birbiriyle tutarlı olsun)
  let avg = top.length ? top.reduce((a, r) => a + r.adj, 0) / top.length : 0;
  if (top.length < 3) avg *= Math.pow(top.length / 3, 0.3);
  return {i, e, list, banned, top, sol, notes, pos, neg, m, score: clamp(Math.round(avg), 0, 99)};
}

// Saatin olumlu (yeşil ✓) ve olumsuz (kırmızı ✗) şartları; max verilirse her gruptan en fazla o kadar
function condHtml(H, max = 9){
  const p = H.pos.slice(0, max), n = H.neg.slice(0, max);
  return [p.length ? `<span style="color:#4caf7a">✓ ${p.join(' · ')}</span>` : '',
          n.length ? `<span style="color:#e06c5a">✗ ${n.join(' · ')}</span>` : ''].filter(Boolean).join('<br>');
}
// Hedef balık seçiliyse o türün puanı, değilse saatin genel puanı (tür burada yoksa null)
function tScore(H){
  if (!state.target) return H.score;
  const r = H.list.find(x => x.fish.id === state.target);
  return r ? r.adj : null;
}
// Harita etiketi: hedef balık ya da ilk 3 tür
function pinHtml(H, extra = ''){
  let body;
  if (state.target) {
    const f = FISH_BY_ID[state.target], s = tScore(H);
    body = s == null ? `<div class="muted">${f.ad}: yok</div>` : `<div class="row3"><span>🎯 ${f.ad}</span><b style="color:${scoreColor(s)}">${s}</b></div>`;
  } else {
    body = H.list.slice(0, 3).map(r => `<div class="row3"><span>${r.fish.ad.split(' ')[0]}</span><b style="color:${scoreColor(r.adj)}">${r.adj}</b></div>`).join('') || '<div class="muted">—</div>';
  }
  const col = scoreColor(tScore(H) ?? 0);
  return `<div class="pin" style="border-color:${state.target && tScore(H) == null ? '#aab' : col}">${body}${extra}</div>`;
}

function conditionTags(e, f){
  const tags = new Set([e.murky ? 'murky' : 'clear', e.period]);
  if (e.water === 'tuzlu' && e.wave != null) tags.add(e.wave < 0.5 ? 'calm' : e.wave > 1.2 ? 'rough' : 'mid');
  if (e.water === 'tatli') tags.add(e.wind < 10 ? 'calm' : e.wind > 25 ? 'rough' : 'mid');
  if (e.period !== 'night') tags.add(e.cloud > 70 ? 'cloudy' : 'sunny');
  if (e.wt < f.t[1]) tags.add('cold');
  if (e.wt > f.t[2]) tags.add('warm');
  return tags;
}
// Yem seçimi: koşul etiketleri + balığın bulunduğu katman + aktivitesi
function pickBaits(f, e, score = 60){
  const tags = conditionTags(e, f), beh = behavior(f, e, score);
  return f.baits.map((b, k) => {
    const bi = baitInfo(b.n), hits = b.c.filter(x => tags.has(x));
    let m = hits.length - k * 0.01;
    if (bi.l.includes(beh.layer)) m += 1.5;
    if (beh.actLevel === 0 && (bi.k === 'kasik' || bi.k === 'sahte')) m -= 0.6;
    if (beh.actLevel === 0 && (bi.k === 'dogal' || bi.k === 'koku' || bi.k === 'canli')) m += 0.4;
    if (beh.actLevel === 2 && (bi.k === 'kasik' || bi.k === 'sahte')) m += 0.3;
    return {...b, ...bi, hits, m};
  }).sort((a, b) => b.m - a.m).slice(0, 3);
}

// "Turna şu an yüzeye yakın ve aktif… bu yüzden kaşık mantıklı" açıklaması
function explainHtml(f, e, score){
  const beh = behavior(f, e, score), baits = pickBaits(f, e, score), b0 = baits[0];
  const fit = [];
  if (b0.l.includes(beh.layer)) fit.push(`${LAYER_TR[beh.layer].split(' /')[0]} çalışır`);
  if (b0.hits.length) fit.push(`${b0.hits.map(h => TAG_TR[h]).join(', ')} koşuluna uygun`);
  if (beh.actLevel === 0 && ['dogal','koku','canli'].includes(b0.k)) fit.push('pasif balık doğal yemi daha kolay alır');
  return `<div class="explain">🧭 <b>${f.ad}</b> şu an büyük olasılıkla <b>${LAYER_TR[beh.layer]}</b> ve <b>${beh.act}</b>: ${beh.r.join(', ')}.<br>
    Bu yüzden <b style="color:var(--good)">${b0.n}</b> en mantıklı seçim. Çünkü ${b0.why}${fit.length ? ` (${fit.join('; ')})` : ''}.
    ${baits.length > 1 ? `<ul>${baits.slice(1).map(b => `<li><b>${b.n}</b>: ${b.why}</li>`).join('')}</ul>` : ''}</div>`;
}
function colorTip(e){
  const fr = e.water === 'tatli';
  if (e.period === 'night') return fr ? 'Gece: kokulu yemler (boilie, ciğer, solucan) ve dip takımı; sahte yemde koyu siluet.' : 'Gece: koyu siluetli veya fosforlu yemler, yavaş hareket.';
  if (e.murky) return fr ? 'Bulanık su: kokulu doğal yem (solucan, boilie), sahte yemde chartreuse/turuncu ve titreşimli modeller.' : 'Bulanık su: parlak/kontrast renkler (chartreuse, turuncu), kokulu doğal yem ve titreşimli sahte yem.';
  if (e.cloud > 70) return 'Kapalı hava: balık daha cesur; beyaz, sarı, sim renkler ve yüzeye yakın sunum.';
  return fr ? 'Berrak ve güneşli: doğal renkler, ince misina, gölgelik ve derin kenarlara yönel.' : 'Berrak ve güneşli: doğal renkler (gümüş, sardalya deseni), ince misina, daha derine in.';
}
function weatherAdvice(e){
  const a = [];
  if (e.ptrend != null && e.ptrend <= -1.5) a.push('Basınç düşüyor: cephe öncesi balık iştahlı olur, bu saatleri kaçırma; hava bozmadan topla.');
  if (e.ptrend != null && e.ptrend >= 2) a.push('Basınç hızla yükseliyor (cephe sonrası): balık temkinli olur; daha küçük yem, daha yavaş sunum.');
  if (e.water === 'tuzlu' && e.wave != null && e.wave >= 0.5 && e.wave <= 1.5) a.push('Orta dalga: köpüklü kıyı hattında levrek/karagöz yem arar, kırılma hattına at.');
  if (e.water === 'tuzlu' && e.wave != null && e.wave < 0.3) a.push('Deniz çarşaf: balık temkinli; ince misina, doğal yem, alacakaranlığı bekle.');
  if (e.rain24 > 5 && (e.hab === 'nehir' || e.hab === 'dere')) a.push('Yağmur sonrası akarsu bulandı: solucan ve kokulu yemler öne çıkar; yayın ve sazan hareketlenir.');
  if (e.rain24 > 5 && e.water === 'tuzlu') a.push('Yağmur sonrası dere ağızları bulanık: levrek için en iyi fırsatlardan biri.');
  if (e.onshore != null && e.onshore >= 0.3) a.push(`Rüzgâr ${dirName(e.windDir)} yönünden kıyıya vuruyor: yem balığı ve plankton kıyıya yığılır; rüzgârın vurduğu kıyı tarafına yönel.`);
  if (e.onshore != null && e.onshore <= -0.3) a.push(`Rüzgâr ${dirName(e.windDir)} yönünden karadan esiyor: su açılır, balık açığa çekilir; uzağa at, derin kenarları dene.`);
  if (e.water === 'tatli' && e.wind >= 10 && e.wind <= 25) a.push(`Rüzgâr ${dirName(e.windDir)} yönünden: rüzgârın vurduğu kıyıda yem birikir, sazan/sudak oraya toplanır.`);
  if (e.wt < 10 && e.water === 'tatli') a.push('Su soğuk: balık yavaş; küçük yem, yavaş çekiş, az yemleme, öğle sıcağını değerlendir.');
  if (e.wt > 24) a.push('Su sıcak: balık derine ve gölgeye çekilir; sabah erken ve akşam geç saatleri tercih et.');
  if (e.wind > 30 || e.gust > 45) a.push('Rüzgâr sert: tekneyle açılma, kayalık ve mendireklerde dikkatli ol.');
  return a;
}

// Varsayılan yalnız deniz. Tatlı su ancak filtreden "Tatlı su" ya da "Deniz + tatlı su" seçilince
// (ya da hedef balık tatlı su balığıysa) taranır, listelenir ve haritaya tıklanınca göl olarak açılır.
const freshOn = () => state.filter !== 'deniz' || !!(state.target && FISH_BY_ID[state.target].water === 'tatli');
function spotVisible(s){
  if (state.filter === 'deniz' && s.w !== 'deniz') return false;
  if (state.filter === 'tatli' && s.w === 'deniz') return false;
  return true;
}
function spotsInSelection(){
  let list = SPOTS.filter(spotVisible);
  if (state.il) list = list.filter(s => s.il === state.il);
  if (state.ilce) {
    const byIlce = list.filter(s => s.ic === state.ilce);
    if (byIlce.length) list = byIlce;
  }
  return list;
}

function spotIcon(s, dot){
  const H = state.ratings[s.n], col = s.w === 'deniz' ? '#2b7bd6' : '#2e9e5b';
  // Popüler (elle derlenmiş) noktalar büyük, OpenStreetMap'ten gelen küçük su kayıtları küçük ve soluk
  const sz = s.auto ? 10 : 16;
  if (!H || dot) return L.divIcon({className:'', iconSize:[sz + 2, sz + 2], iconAnchor:[sz / 2 + 1, sz / 2 + 1],
    html:`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${col};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);${s.auto ? 'opacity:.75' : ''}"></div>`});
  return L.divIcon({className:'', iconSize:null, html:pinHtml(H)});
}
// Harita baloncuğu (ilk 3 balık) kabaca 120×80 px yer kaplar; iki baloncuğun köşe noktaları bundan yakınsa çakışır
const BUB_W = 124, BUB_H = 84, bubFits = (cp, taken) => taken.every(q => Math.abs(cp.x - q.x) > BUB_W || Math.abs(cp.y - q.y) > BUB_H);
let pinnedSpots = new Set(), scanBubbles = [];
function drawSpots(){
  spotLayer.clearLayers();
  // Puanlı meraların baloncukları birbirinin ve tarama baloncuklarının üstüne binmesin (uzak zoomda körfezi tamamen
  // kaplıyordu): önce taramanın en iyi noktaları (drawScan), sonra en yüksek puanlı mera yerleşir; çakışan mera küçük
  // nokta olarak kalır. Zoom değişince yeniden hesaplanır.
  const placed = scanBubbles.map(ll => map.latLngToContainerPoint(ll));
  pinnedSpots = new Set(SPOTS.filter(s => spotVisible(s) && state.ratings[s.n])
    .sort((a, b) => (tScore(state.ratings[b.n]) ?? -1) - (tScore(state.ratings[a.n]) ?? -1))
    .filter(s => { const cp = map.latLngToContainerPoint([s.lat, s.lng]); if (!bubFits(cp, placed)) return false; placed.push(cp); return true; }));
  SPOTS.filter(spotVisible).forEach(s => {
    L.marker([s.lat, s.lng], {icon: spotIcon(s, !pinnedSpots.has(s)), riseOnHover:true}).addTo(spotLayer)
      .bindTooltip(`<b>${s.n}</b><br>${W_NAMES[s.w]} · ${s.il}/${s.ic}`, {direction:'top', offset:[0,-8]})
      .on('click', () => openSpot(s));
  });
  updateLabels();
}

// ---------- Popüler noktalar: harita etiketleri, liste ve arama ----------
// Popüler: elle derlenen noktalar + Google'da 50'den fazla yorumu olan göl/göletler
const isPop = s => !s.auto || !!(s.g && s.g[0] >= 50);
const gCount = s => s.g ? s.g[0] : 0;
// Google Haritalar'da yerin sayfası (puan, yorum sayısı ve yorumlar orada güncel görünür)
// Puanı alınan kayıt varsa o kaydın adıyla, tam konumunda yakın zoomda aranır (aynı adlı başka yerler açılmasın)
const gmapsUrl = s => s.gUri ||
  (s.gp ? `https://www.google.com/maps/search/${encodeURIComponent(s.gp[0])}/@${s.gp[1]},${s.gp[2]},18z?hl=tr`
        : 'https://www.google.com/maps/search/?api=1&query=' +
          encodeURIComponent(`${s.n.replace(/\s*\(.*?\)\s*/g, ' ').trim()} ${s.ic && s.ic !== 'Merkez' ? s.ic + ' ' : ''}${s.il}`));
function gBadge(s){
  if (!s.g) return `<a class="gbadge muted" href="${gmapsUrl(s)}" target="_blank" rel="noopener">Google Haritalar'da aç ↗</a>`;
  const [k, r] = s.g;
  return `<a class="gbadge" href="${gmapsUrl(s)}" target="_blank" rel="noopener" title="Google'daki yorum sayfasını aç">⭐ ${r ? r.toFixed(1).replace('.', ',') + ' · ' : ''}${k.toLocaleString('tr-TR')} yorum ↗</a>` +
    `<span class="sub"> ${s.gLive ? 'şu an' : GOOGLE_AT + ' itibarıyla'}</span>`;
}
// Anahtar varsa: nokta açılınca Google'dan güncel puan ve yorum sayısı (yorum metinleri çekilmez)
const gLiveCache = {};
async function liveGoogle(s){
  if (!GOOGLE_PLACES_KEY || s.custom) return false;
  if (gLiveCache[s.n]) return false;
  gLiveCache[s.n] = true;
  try {
    const r = await fetch('https://places.googleapis.com/v1/places:searchText', {method:'POST',
      headers:{'Content-Type':'application/json', 'X-Goog-Api-Key':GOOGLE_PLACES_KEY,
        'X-Goog-FieldMask':'places.rating,places.userRatingCount,places.googleMapsUri'},
      body: JSON.stringify({textQuery: s.n.replace(/\s*\(.*?\)\s*/g, ' ') + ' ' + s.il, pageSize:1,
        locationBias:{circle:{center:{latitude:s.lat, longitude:s.lng}, radius:3000}}})});
    const p = r.ok && (await r.json()).places?.[0];
    if (!p || !p.userRatingCount) return false;
    s.g = [p.userRatingCount, p.rating ?? null]; s.gUri = p.googleMapsUri; s.gLive = true;
    return true;
  } catch { return false; }
}
const labelLayer = L.layerGroup().addTo(map);
// İlçe seçiliyse o ilçenin popüler noktaları her zaman; yakınlaşınca (zoom ≥ 11) görünen alandaki tüm popüler noktalar
function updateLabels(){
  labelLayer.clearLayers();
  const b = map.getBounds().pad(0.05), z = map.getZoom();
  const list = SPOTS.filter(s => spotVisible(s) && b.contains([s.lat, s.lng]) && !state.ratings[s.n] && (
    (isPop(s) && (z >= 11 || (state.ilce && s.il === state.il && s.ic === state.ilce) || (state.il && s.il === state.il && z >= 10))) ||
    (s.auto && z >= 13)));
  list.slice(0, 80).forEach(s => {
    L.marker([s.lat, s.lng], {interactive:true, keyboard:false, zIndexOffset:-100, icon: L.divIcon({className:'', iconSize:null,
      html:`<div class="spotlbl ${waterOf(s.w)}">${s.n}</div>`})}).addTo(labelLayer).on('click', () => openSpot(s));
  });
}
map.on('zoomend moveend', updateLabels);
map.on('zoomend', () => { if (pinnedSpots.size && !state.scan.length) drawSpots(); });   // tarama varsa drawScan çizer

function popularSpots(){
  let list = SPOTS.filter(s => spotVisible(s) && (!state.il || s.il === state.il));
  if (state.ilce) { const d = list.filter(s => s.ic === state.ilce); if (d.length) list = d; }
  return list.sort((a, b) => (isPop(b) - isPop(a)) || (gCount(b) - gCount(a)) || ((b.src ? 1 : 0) - (a.src ? 1 : 0)) || a.n.localeCompare(b.n, 'tr'));
}
function renderPopular(){
  const list = popularSpots(), pops = list.filter(isPop);
  const where = state.ilce ? `${state.ilce}` : state.il || 'Tüm bölge';
  $('popTitle').textContent = `POPÜLER NOKTALAR · ${where.toLocaleUpperCase('tr')} (${pops.length})`;
  const show = (pops.length ? pops : list).slice(0, state.il ? 40 : 24);
  $('popList').innerHTML = show.length
    ? show.map(s => `<span class="fchip ${isPop(s) ? 'pop' : ''}" data-spot="${s.n}">${s.w === 'deniz' ? '🌊' : '🏞️'} ${s.n}${s.g ? ` <small class="sub">⭐${s.g[0].toLocaleString('tr-TR')}</small>` : ''}</span>`).join('')
    : '<span class="sub">Bu seçimde kayıtlı nokta yok; haritada istediğin yere dokunabilirsin.</span>';
  // Arama önerileri seçili il/ilçeyle sınırlı (ilçe seçiliyse sadece o ilçenin noktaları)
  $('spotList').innerHTML = searchScope().map(s => `<option value="${s.n}">${s.il} / ${s.ic} · ${W_NAMES[s.w]}</option>`).join('');
  $('spotSearch').placeholder = state.ilce ? `${state.ilce} içinde ara…` : state.il ? `${state.il} içinde ara…` : 'ör. Hereke, Sapanca, Kilyos…';
}
function searchScope(){
  return SPOTS.filter(s => spotVisible(s) && (!state.il || s.il === state.il) && (!state.ilce || s.ic === state.ilce));
}
// Arama: tam ad ya da adın bir kısmı (ör. "hereke" → "Hereke sahili")
function findSpot(q){
  const n = q.trim().toLocaleLowerCase('tr');
  if (!n) return null;
  const pool = searchScope();
  return pool.find(s => s.n.toLocaleLowerCase('tr') === n) ||
    pool.filter(s => s.n.toLocaleLowerCase('tr').includes(n)).sort((a, b) => isPop(b) - isPop(a))[0] || null;
}
function goSpot(s){
  closeBars(); closeModal();
  map.flyTo([s.lat, s.lng], Math.max(map.getZoom(), 13), {duration:0.6});
  openSpot(s);
}

const ilSel = $('ilSel'), ilceSel = $('ilceSel');
// İl ve ilçe listeleri Türkçe alfabetik (Ç, Ğ, İ, Ö, Ş, Ü doğru yerde)
Object.keys(PROV).sort((a, b) => a.localeCompare(b, 'tr')).forEach(il => ilSel.add(new Option(il, il)));
const geoCache = {};
async function geocode(q){
  if (q in geoCache) return geoCache[q];
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&polygon_geojson=1&polygon_threshold=0.003&countrycodes=tr&accept-language=tr&q=' + encodeURIComponent(q));
    const j = await r.json();
    return geoCache[q] = j[0] || null;
  } catch { return geoCache[q] = null; }
}
// Bir noktaya en yakın deniz (yükseklik tam 0): 0,5–10 km halkalarda 16 yön; ilk bulunan halkadaki en yakın nokta.
// Kıyıdaki ilk deniz noktası biraz kıyı içine kaydırılmış olur (halka çözünürlüğü kadar); ortalama için yeterli.
// Noktayı haritanın panelce kapatılmayan görünen kısmının tam ortasına getirir (mobilde alt panel, masaüstünde yan panel)
function flyToVisible(ll, z){
  const vb = visibleBounds(), full = map.getBounds();
  const vc = map.latLngToContainerPoint(vb.getCenter()), fc = map.latLngToContainerPoint(full.getCenter());
  const target = map.project(ll, z).subtract(vc.subtract(fc));
  map.flyTo(map.unproject(target, z), z, {duration:0.8});
}
async function nearestSea(ll){
  for (const r of [500, 1000, 2000, 3500, 5500, 8000, 10000]) {
    const pts = [];
    for (let b = 0; b < 360; b += 22.5) pts.push(offsetLL(ll, r, b));
    let el;
    try { el = await elevations(pts); } catch { return null; }
    const k = el.findIndex(v => v === 0);
    if (k >= 0) return {lat:pts[k].lat, lng:pts[k].lng};
  }
  return null;
}
async function zoomTo(il, ilce){
  if (boundaryLayer) { map.removeLayer(boundaryLayer); boundaryLayer = null; }
  if (!il) { map.flyToBounds([[40.0, 26.2], [42.0, 33.5]], {duration:0.8}); return; }
  const P = PROV[il];
  map.flyTo(P.c, P.z, {duration:0.6});
  let g = await geocode(ilce ? `${ilce}, ${il}` : `${il}`);
  if (ilce && !g) g = await geocode(il);
  if (!g || ilSel.value !== il || ilceSel.value !== ilce) return;
  // İlçe seçilince harita, ilçe merkezine en yakın deniz kıyısı noktasını ortalar (ör. Körfez → Tütünçiftlik iskelesi).
  // İlçede kayıtlı deniz noktası yoksa merkezden halka halka aranan en yakın gerçek kıyı; o da yoksa (ya da tatlı su seçiliyse) ilçe sınırı.
  let coast = null;
  if (ilce && state.filter !== 'tatli') {
    const c = [+g.lat, +g.lon], dist = s => map.distance(c, [s.lat, s.lng]);
    const own = SPOTS.filter(s => s.w === 'deniz' && s.il === il && s.ic === ilce).sort((a, b) => dist(a) - dist(b));
    coast = own[0] || await nearestSea(L.latLng(c));
    if (ilSel.value !== il || ilceSel.value !== ilce) return;
  }
  if (g.geojson && /Polygon/.test(g.geojson.type)) {
    boundaryLayer = L.geoJSON(g.geojson, {style:{color:'#e0533b', weight:2.5, dashArray:'6 5', fill:true, fillOpacity:0.04}, interactive:false}).addTo(map);
    if (coast) flyToVisible(L.latLng(coast.lat, coast.lng), 13);
    else map.flyToBounds(boundaryLayer.getBounds(), {padding:[30, 30], duration:0.8});
  } else if (coast) {
    flyToVisible(L.latLng(coast.lat, coast.lng), 13);
  } else if (g.boundingbox) {
    const [s, n, w, e] = g.boundingbox.map(Number);
    map.flyToBounds([[s, w], [n, e]], {padding:[30, 30], duration:0.8});
  }
}
ilSel.onchange = () => {
  state.il = ilSel.value; state.ilce = '';
  ilceSel.innerHTML = '';
  ilceSel.add(new Option(state.il ? 'Tüm ilçeler' : 'İlçe', ''));
  if (state.il) PROV[state.il].d.split(',').sort((a, b) => a.localeCompare(b, 'tr')).forEach(d => ilceSel.add(new Option(d, d)));
  ilceSel.disabled = !state.il;
  zoomTo(state.il, '');
  renderSpotList(); showTab('noktalar', false);
};
// İl/ilçe değişince liste güncellenir ama mobilde alt panel kendiliğinden açılmaz (filtre paneli kapanmasın)
ilceSel.onchange = () => { state.ilce = ilceSel.value; zoomTo(state.il, state.ilce); renderSpotList(); showTab('noktalar', false); };

$('handle').onclick = () => panel.dataset.state = panel.dataset.state === 'min' ? 'half' : 'min';
{
  const LV = ['min', 'half', 'full'];
  let y0 = null;
  const area = [$('handle'), document.querySelector('#panel .tabs')];
  area.forEach(el => {
    el.addEventListener('touchstart', ev => { y0 = ev.touches[0].clientY; }, {passive:true});
    el.addEventListener('touchend', ev => {
      if (y0 == null) return;
      const dy = ev.changedTouches[0].clientY - y0; y0 = null;
      if (Math.abs(dy) < 35) return;
      const k = LV.indexOf(panel.dataset.state);
      panel.dataset.state = LV[clamp(k + (dy < 0 ? 1 : -1), 0, 2)];
      ev.preventDefault();
    });
  });
}
function showTab(t, open = true){
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.id === 'tab-' + t));
  if (open && panel.dataset.state === 'min') sheet('half');
}

// ---------- Nokta aç ----------
async function openSpot(spot, focusTime){
  if (document.body.classList.contains('fs')) setFs(false);
  if (selMarker) map.removeLayer(selMarker);
  selMarker = L.circleMarker([spot.lat, spot.lng], {radius:14, color:'#e0533b', weight:3, fill:false}).addTo(map);
  showTab('detay'); sheet('half');
  $('tab-detay').innerHTML = loading(`${spot.n} için canlı veri ve 7 günlük tahmin çekiliyor…`);
  $('tab-hafta').innerHTML = loading('Hazırlanıyor…');
  try {
    const [S] = await fetchSeries([spot]);
    state.S = S;
    liveGoogle(spot).then(ok => { if (ok && state.S && state.S.p === spot) renderDetail(); });
    state.hours = [];
    for (let i = S.nowIdx; i < S.F.hourly.time.length; i++) state.hours.push(hourScore(S, i));
    state.sel = Math.max(0, focusTime ? state.hours.findIndex(h => h.e.time === focusTime) : 0);
    renderDetail(); renderWeek();
  } catch (err) {
    $('tab-detay').innerHTML = `<div class="card"><b>Hata:</b> ${err.message}. İnternet bağlantını kontrol edip tekrar dene.</div>`;
  }
}

// Haritada boş bir yere dokunma
async function clickPoint(ll){
  if (!REGION.contains(ll)) return;
  showTab('detay'); sheet('half');
  if (selMarker) map.removeLayer(selMarker);
  selMarker = L.circleMarker(ll, {radius:10, color:'#e0533b', weight:3, fill:false}).addTo(map);
  $('tab-detay').innerHTML = loading('Nokta kontrol ediliyor (deniz mi, kara mı)…');
  const c = await classifyPoint(ll);
  if (c.sea) {
    let shore = c.coast ? 150 : null;
    if (!c.coast) { try { shore = await shoreDistance(ll); } catch {} }
    openSpot({n: c.coast ? 'Seçilen kıyı noktası' : 'Seçilen deniz noktası', il:'', ic:'', w:'deniz', lat:ll.lat, lng:ll.lng,
      d:c.depth, f:[], custom:true, shore,
      dNote: c.coast ? `kıyıya yakın, ${c.src.startsWith('EMODnet') ? 'EMODnet' : 'tahmini'}` : c.src,
      not: c.coast ? 'Tıkladığın yer kıyı çizgisinde; kıyıdan atış yapılacak su olarak değerlendirildi.' : ''});
    return;
  }
  // Göl mü deniz mi sorusu yalnız "Deniz + tatlı su" seçiliyken sorulur; tek su tipi seçiliyse doğrudan o açılır
  if (c.ambiguous && state.filter !== 'hepsi') {
    if (state.filter === 'tatli' || (state.target && FISH_BY_ID[state.target].water === 'tatli')) { openSpot(lakeSpotAt(c.lake, ll)); return; }
    openSpot({n:'Seçilen kıyı noktası', il:'', ic:'', w:'deniz', lat:ll.lat, lng:ll.lng, d:c.depth, f:[], custom:true,
      dNote:`kıyıya yakın, ${c.src === 'EMODnet' ? 'EMODnet' : 'tahmini'}`});
    return;
  }
  if (c.ambiguous) {
    $('tab-detay').innerHTML = `<div class="card"><h3>Göl mü, deniz mi?</h3>
      <p class="hint">Bu nokta hem <b>${c.lake.n}</b> (${W_NAMES[c.lake.w].toLowerCase()}) hem de denize yakın. Hangisini analiz edelim?</p>
      <div class="tags" style="margin-top:10px">
        <button id="pickLake" class="primary">🏞️ ${c.lake.n}</button>
        <button id="pickSea">🌊 Deniz kıyısı</button>
      </div></div>`;
    $('pickLake').onclick = () => openSpot(lakeSpotAt(c.lake, ll));
    $('pickSea').onclick = () => openSpot({n:'Seçilen kıyı noktası', il:'', ic:'', w:'deniz', lat:ll.lat, lng:ll.lng, d:c.depth, f:[], custom:true,
      dNote:`kıyıya yakın, ${c.src === 'EMODnet' ? 'EMODnet' : 'tahmini'}`});
    return;
  }
  // Deniz yok ama yakında göl/baraj var: doğrudan o su olarak aç
  if (c.lake) { openSpot(lakeSpotAt(c.lake, ll)); return; }
  const near = SPOTS.map(s => [s, map.distance(ll, [s.lat, s.lng])]).sort((a, b) => a[1] - b[1]).slice(0, 3);
  $('tab-detay').innerHTML = `<div class="card"><h3>Kara noktası</h3>
    <p class="hint">Burada ve yakın çevresinde deniz bulunamadı. Bir göl, baraj ya da akarsu kenarındaysan tatlı su olarak analiz edebilirsin.
      Deniz kıyısında olduğundan eminsen deniz olarak da analiz edebilirsin:</p>
    <div class="tags" style="margin-top:10px">
      ${c.lake ? `<button id="pickLake" class="primary">🏞️ ${c.lake.n} olarak analiz et</button>` : ''}
      <button data-w="deniz">🌊 Deniz kıyısı olarak analiz et</button>
      ${['gol','baraj','nehir','dere'].map(w => `<button data-w="${w}">${W_NAMES[w]} olarak analiz et</button>`).join('')}

  $('tab-detay').querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
    const s = SPOTS.find(x => x.n === b.dataset.n); map.flyTo([s.lat, s.lng], 13); openSpot(s);
  });
}

function dayLabel(time){
  const d = new Date(time.slice(0, 10) + 'T12:00Z');
  const today = todayStr();
  const diff = Math.round((d - new Date(today + 'T12:00Z')) / 86400000);
  return diff === 0 ? 'Bugün' : diff === 1 ? 'Yarın' : `${DAYS[d.getUTCDay()]} ${d.getUTCDate()}`;
}

// ---------- 7 gün / saat saat ----------
function windows(hours, best, count){
  const used = new Set(), out = [];
  const order = [...hours].sort((a, b) => best ? b.score - a.score : a.score - b.score);
  for (const seed of order) {
    if (out.length >= count) break;
    const k = hours.indexOf(seed);
    if (used.has(k)) continue;
    let a = k, b = k;
    while (b - a < 2) {
      const L_ = hours[a-1], R_ = hours[b+1];
      const okL = L_ && !used.has(a-1) && Math.abs(L_.score - seed.score) <= 10;
      const okR = R_ && !used.has(b+1) && Math.abs(R_.score - seed.score) <= 10;
      if (okR && (!okL || R_.score * (best ? 1 : -1) >= L_.score * (best ? 1 : -1))) b++;
      else if (okL) a--;
      else break;
    }
    for (let x = a - 1; x <= b + 1; x++) used.add(x);
    const seg = hours.slice(a, b + 1);
    out.push({a:hours[a], b:hours[b], score: Math.round(seg.reduce((s, h) => s + h.score, 0) / seg.length)});
  }
  return out;
}
const endHour = h => { const n = (+h.e.time.slice(11, 13) + 1) % 24; return String(n).padStart(2, '0') + ':00'; };
const winText = w => `${hh(w.a.e.time)}–${endHour(w.b)}`;

    if (!tgt) return h;
    const r = h.list.find(x => x.fish.id === tgt.id);
    return {...h, score: r ? r.adj : 0, top: r ? [r] : []};
  });

    × olumsuz şartlar (fırtına ve ±2 saati, sert rüzgâr, kuvvetli yağış, dalga, güneşli öğle). 4. günden sonra tahmin belirsizleştiği için her gün %4 kırpılır.</p>`;
  $('tab-hafta').innerHTML = html;
  hydrate($('tab-hafta'));
  $('tab-hafta').querySelectorAll('.strip button[data-k]').forEach(b => b.onclick = () => {
    state.sel = +b.dataset.k; renderDetail(); renderWeek(); showTab('detay');
  });
}

// ---------- Noktalar listesi ----------
// Bölge özeti: seçili il/ilçedeki puanlanmış noktalar + görünen alandaki açık deniz noktaları birlikte.
// Tür ortalaması tüm noktalara bölünür (türün beklenmediği nokta 0 sayılır) → bölgedeki toplam olasılık.
function regionSummaryHtml(list, where){
  const pts = [];
  list.forEach(s => { const H = state.ratings[s.n]; if (H) pts.push({name:s.n, H}); });
  const view = map.getBounds();
  state.scan.forEach(({S, H}) => { if (view.contains([S.p.lat, S.p.lng])) pts.push({name:`açık deniz ${Math.round(S.p.d)} m`, H}); });
  if (!pts.length) return `<div class="card"><h2>📊 Bölge özeti · ${where}</h2>
    <p class="hint">Bölgedeki toplam balık olasılığını görmek için aşağıdan <b>noktaları puanla</b> ya da 🔍 <b>Tara</b>.</p></div>`;
  const agg = {};
  pts.forEach(({name, H}) => H.list.forEach((r, k) => {
    const a = agg[r.fish.id] ||= {f:r.fish, sum:0, best:-1, at:'', top:0};
    a.sum += r.adj; if (r.adj > a.best) { a.best = r.adj; a.at = name; } if (k < 3) a.top++;
  }));
  const rows = Object.values(agg).map(a => ({...a, avg: Math.round(a.sum / pts.length)}))
    .sort((x, y) => (y.avg - x.avg) || (y.best - x.best)).slice(0, 10);
  const reg = Math.round(pts.reduce((s, x) => s + x.H.score, 0) / pts.length);
  const best = pts.reduce((b, x) => x.H.score > b.H.score ? x : b);
  return `<div class="card"><h2>📊 Bölge özeti · ${where} · ${pts.length} nokta</h2>
    <div class="big"><div class="num" style="color:${scoreColor(reg)}">${reg}</div>
      <div><b>${scoreLabel(reg)}</b><div class="sub">bölgenin bu saatteki ortalaması · en iyi nokta: <b style="color:var(--text)">${best.name}</b> (${best.H.score})</div></div></div>
    <p class="note" style="margin:8px 0 4px">Balıkların bölge genelindeki olasılığı (ortalama · en iyi nokta · kaç noktada ilk 3'te). Bir balığa dokununca o balık hedef seçilir.</p>
    ${rows.map(a => `<button class="regrow ${state.target === a.f.id ? 'on' : ''}" data-tgt="${a.f.id}">${fimg(a.f.id)}
      <span><b>${a.f.ad}</b><span class="bar" style="margin:3px 0"><i style="width:${a.avg}%;background:${scoreColor(a.avg)}"></i></span>
        <span class="sub">en iyi ${a.best} · ${a.at} · ${a.top}/${pts.length} noktada ilk 3</span></span>
      <span class="score" style="color:${scoreColor(a.avg)}">${a.avg}</span></button>`).join('')}
  </div>`;
}

function renderSpotList(){
  const list = spotsInSelection();
  const where = state.ilce ? `${state.il} / ${state.ilce}` : state.il || 'Tüm bölge';
  const noIlce = state.ilce && !SPOTS.some(s => s.il === state.il && s.ic === state.ilce && spotVisible(s));
  let html = regionSummaryHtml(list, where) + `<div class="card"><h2>${where} · ${list.length} nokta</h2>
    ${noIlce ? `<p class="hint">${state.ilce} ilçesinde kayıtlı nokta yok; ${state.il} genelindeki noktalar gösteriliyor. Haritada istediğin yere dokunarak da analiz yapabilirsin.</p>` : ''}
    <button class="primary" id="rateList" style="width:100%;margin-top:6px">Bu noktaları şu anki koşullara göre puanla</button></div>`;
  const rs = s => { const H = state.ratings[s.n]; return H ? (tScore(H) ?? -1) : -2; };
  const sorted = [...list].sort((a, b) => rs(b) - rs(a));
  html += sorted.map(s => {
    const H = state.ratings[s.n], sc = H ? tScore(H) : null;
    let now = '';
    if (H && state.target) {
      const r = H.list.find(x => x.fish.id === state.target);
      now = r ? `🎯 ${r.fish.ad}: <b style="color:${scoreColor(r.adj)}">${r.adj}</b> · ${pickBaits(r.fish, H.e, r.score)[0].n}` : `🎯 ${FISH_BY_ID[state.target].ad} bu noktada beklenmez`;
    } else if (H) {
      now = 'Şu an ilk 3: ' + H.list.slice(0, 3).map(r => `<b style="color:var(--text)">${r.fish.ad}</b> <span style="color:${scoreColor(r.adj)}">${r.adj}</span>`).join(' · ');
      if (H.list[0]) now += `<br>Yem (${H.list[0].fish.ad}): ${pickBaits(H.list[0].fish, H.e, H.list[0].score)[0].n}`;
    }
    return `<button class="spot" data-n="${s.n}">
      ${sc != null ? `<span class="rt" style="color:${scoreColor(sc)}">${sc}</span>` : ''}
      <span class="nm">${s.n}</span> <span class="badge ${waterOf(s.w)}">${W_NAMES[s.w]}</span><br>
      <span class="sub">${s.il} / ${s.ic}</span>${s.g ? ' · ' + gBadge(s) : ''}<br>${s.f.slice(0, 5).map(fchip).join('')}
      ${now ? `<br><span class="sub">${now}</span>` : ''}
    </button>`;
  }).join('');
  $('tab-noktalar').innerHTML = html;
  hydrate($('tab-noktalar'));
  $('rateList').onclick = rateSpots;
  $('tab-noktalar').querySelectorAll('.regrow').forEach(b => b.onclick = () => setTarget(state.target === b.dataset.tgt ? '' : b.dataset.tgt));
  $('tab-noktalar').querySelectorAll('.spot').forEach(b => b.onclick = () => {
    const s = SPOTS.find(x => x.n === b.dataset.n); map.flyTo([s.lat, s.lng], 12, {duration:0.6}); openSpot(s);
  });
}

// ---------- Noktaları puanla ----------
async function rateSpots(){
  let list = spotsInSelection();
  if (!state.il) list = list.filter(s => map.getBounds().contains([s.lat, s.lng]));
  if (!list.length) { alert('Görünen alanda nokta yok. Bir il seç ya da haritayı kaydır.'); return; }
  list = list.slice(0, 60);
  const btn = $('rateBtn'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Puanlanıyor…';
  try {
    const series = await fetchSeries(list);
    series.forEach(S => { state.ratings[S.p.n] = hourScore(S, S.nowIdx); });
    drawSpots(); renderSpotList(); showTab('noktalar');
  } catch (err) { alert('Puanlama başarısız: ' + err.message); }
  finally { btn.disabled = false; btn.innerHTML = '⭐<span class="lbl"> Noktaları puanla</span>'; }
}

// ---------- Tara ısı haritası ----------
// Görünen deniz ızgaraya bölünür; her hücre kendi derinliği, kıyıya uzaklığı ve en yakın hava/deniz verisiyle puanlanır
const heatLayer = L.layerGroup().addTo(map), heatRenderer = L.canvas({padding:0.3});

// Isı haritası, haritanın ekranda deniz olarak çizdiği piksellere kırpılır (CSS mask): derinlik/yükseklik verisi 30–115 m
// çözünürlükte olduğundan kıyıda taşma/boşluk kalıyordu; maske kıyıyı ekran pikseline oturtur (en fazla ~yarım piksel).
// Deniz pikseli: belirgin mavi (b > 150 ve b − r > 22) — topo, sokak, okyanus ve OSM katmanlarının su renkleri buna uyar.
// Denizdeki yazı/çizgilerin açtığı küçük delikler 2 px kapama (genişlet → daralt) ile kapanır; kıyı çizgisi kaymaz.
let maskTimer = null, maskWorks = true, lastMask = null;
// Ekrandaki bir nokta (clientX/Y) ısı haritasının görünen (maskelenmemiş) kısmında mı? Maske yoksa her yer görünür sayılır.
function maskVisible(cx, cy){
  const cv = heatRenderer._container;
  if (!maskWorks || !lastMask || !cv) return true;
  const r = cv.getBoundingClientRect(), {a, W, H} = lastMask;
  const x = Math.floor((cx - r.left) * W / r.width), y = Math.floor((cy - r.top) * H / r.height);
  return x >= 0 && y >= 0 && x < W && y < H && a[y * W + x] === 1;
}
const scheduleMask = () => { clearTimeout(maskTimer); maskTimer = setTimeout(applyHeatMask, 120); };
function activeBase(){
  for (const l of [topo, street, osm]) if (map.hasLayer(l)) return l;
  return map.hasLayer(ocean) ? ocean.getLayers()[0] : null;
}
// Genişlet (grow) / daralt: yatay sonra dikey, kayan pencere toplamıyla (piksel başına sabit iş)
function morph(a, W, H, rad, grow){
  const b = new Uint8Array(a.length);
  const pass = (src, dst, n, len, stride, step) => {
    for (let i = 0; i < n; i++) {
      const o = i * stride;
      let s = 0;
      for (let k = 0; k <= rad && k < len; k++) s += src[o + k * step];
      for (let j = 0; j < len; j++) {
        const lo = Math.max(0, j - rad), hi = Math.min(len - 1, j + rad);
        dst[o + j * step] = grow ? (s > 0 ? 1 : 0) : (s === hi - lo + 1 ? 1 : 0);
        if (j + rad + 1 < len) s += src[o + (j + rad + 1) * step];
        if (j - rad >= 0) s -= src[o + (j - rad) * step];
      }
    }
  };
  pass(a, b, H, W, W, 1);   // satırlar
  pass(b, a, W, H, 1, W);   // sütunlar
}
function applyHeatMask(){
  const cv = heatRenderer._container, base = activeBase();
  if (!cv || !state.scan.length || !base || !base._tiles) return;
  const cr = cv.getBoundingClientRect(), W = Math.round(cr.width), H = Math.round(cr.height);
  if (!W || !H) return;
  const m = document.createElement('canvas'); m.width = W; m.height = H;
  const g = m.getContext('2d', {willReadFrequently:true});
  for (const t of Object.values(base._tiles)) {
    const im = t.el; if (!t.loaded || !im.complete || !im.naturalWidth) continue;
    const r = im.getBoundingClientRect();
    g.drawImage(im, r.left - cr.left, r.top - cr.top, r.width, r.height);
  }
  let d;
  // Karo okunamıyorsa (CORS) maske kapatılır ve kıyı hücreleri yine şerit şerit (kısmi) çizilir
  try { d = g.getImageData(0, 0, W, H); } catch { if (maskWorks) { maskWorks = false; drawScan(); } return; }
  const a = new Uint8Array(W * H), px = d.data;
  for (let i = 0, p = 0; i < a.length; i++, p += 4) a[i] = px[p + 3] > 0 && px[p + 2] > 150 && px[p + 2] - px[p] > 22 ? 1 : 0;
  morph(a, W, H, 2, true); morph(a, W, H, 2, false);
  lastMask = {a, W, H};   // dokunmatikte "parmak boyalı denizde mi" kontrolü için
  for (let i = 0, p = 0; i < a.length; i++, p += 4) { px[p] = px[p + 1] = px[p + 2] = 0; px[p + 3] = a[i] ? 255 : 0; }
  g.putImageData(d, 0, 0);
  const url = `url(${m.toDataURL()})`;
  Object.assign(cv.style, {maskImage:url, webkitMaskImage:url, maskSize:'100% 100%', webkitMaskSize:'100% 100%', maskRepeat:'no-repeat', webkitMaskRepeat:'no-repeat'});
}
heatRenderer.on('update', scheduleMask);
[topo, street, osm, ocean.getLayers()[0]].forEach(l => l.on('load', scheduleMask));
map.on('baselayerchange', scheduleMask);
const shoreTxt = m => m == null ? '' : m <= 150 ? 'kıyıdan' : '🚤 ' + (m < 1000 ? Math.round(m / 50) * 50 + ' m' : (m / 1000).toFixed(1).replace('.', ',') + ' km');
// Isı haritası rengi: puan arttıkça kırmızı → turuncu → sarı → açık yeşil → yeşil arasında kesintisiz geçiş.
// Doygun tonlar: soluk sarı mavi denizin üstünde haritanın bej kara rengine benzeyip "boş" gibi görünüyordu.
const HEAT_STOPS = [[20, [214, 39, 40]], [35, [247, 120, 20]], [50, [255, 214, 0]], [65, [140, 205, 30]], [80, [0, 160, 70]]];
function heatColor(s){
  if (s <= HEAT_STOPS[0][0]) return `rgb(${HEAT_STOPS[0][1]})`;
  for (let k = 1; k < HEAT_STOPS.length; k++) {
    const [s1, c1] = HEAT_STOPS[k], [s0, c0] = HEAT_STOPS[k - 1];
    if (s <= s1) { const t = (s - s0) / (s1 - s0); return `rgb(${c0.map((v, j) => Math.round(v + (c1[j] - v) * t))})`; }
  }
  return `rgb(${HEAT_STOPS[HEAT_STOPS.length - 1][1]})`;
}
function drawScan(){
  scanLayer.clearLayers(); heatLayer.clearLayers();
  state.scan = state.scan.filter(x => !x.at || Date.now() - x.at < SCAN_SHOW);   // 10 dk'yı geçen bölgeler düşer
  const scored = state.scan.map(x => ({...x, s: tScore(x.H)}));
  // Renk için komşu hücrelerle yumuşatma (2 tur 3×3 ağırlıklı ortalama): hücreden hücreye renk birden değişmez.
  // Dokununca görünen puan hücrenin kendi puanıdır.
  // Hücre kimliği = kafes (zoom) + kafesteki satır/sütun: farklı taramaların hücreleri karışmaz, komşular kesintisiz eşleşir
  const idx = {}, cid = (p, r, c) => p.lk + ':' + r + ',' + c;
  scored.forEach(x => { if (x.S.p.rc && x.s != null) idx[cid(x.S.p, ...x.S.p.rc)] = x; });
  scored.forEach(x => x.sm = x.s);
  for (let pass = 0; pass < 2; pass++) {
    const next = new Map();
    scored.forEach(x => {
      if (x.s == null || !x.S.p.rc) return;
      const [r, c] = x.S.p.rc;
      let sum = 0, w = 0;
      for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
        const q = idx[cid(x.S.p, r + i, c + j)]; if (!q) continue;
        const k = i === 0 && j === 0 ? 4 : (i && j ? 1 : 2);
        sum += q.sm * k; w += k;
      }
      next.set(x, sum / w);
    });
    next.forEach((v, x) => x.sm = v);
  }
  // Renk = gerçek puan (mutlak ölçek): yeşil yalnız gerçekten yüksek puanda görünür. Ekrana göre esnetilmez,
  // yoksa orta puanlı bir körfez bile "en iyi" diye yemyeşil görünür.
  scored.forEach(x => {
    const {S, s, sm} = x, p = S.p, [dLat, dLng] = p.cell || [0.004, 0.005];
    // Kıyı hücresi: sadece deniz olan şerit parçaları (karaya taşmasın)
    // Maske çalışıyorsa kıyı hücresi tam boyanır, maske onu kıyı çizgisine kırpar (boşluk kalmaz);
    // çalışmıyorsa yalnız derinlik verisindeki deniz şeritleri boyanır (taşmasın)
    const boxes = (!maskWorks && p.boxes) || [[[p.lat - dLat / 2, p.lng - dLng / 2], [p.lat + dLat / 2, p.lng + dLng / 2]]];
    boxes.forEach(bx => {
      const rc = L.rectangle(bx, {renderer:heatRenderer, stroke:false, fillColor: s == null ? '#7a8590' : heatColor(sm), fillOpacity: s == null ? 0.18 : 0.75});
      // Dokunmatikte üzerine gelme yok: bilgi tek parmakla gezinerek (scrubAt) gösterilir, detay bilgi kutusuna dokununca açılır
      if (!TOUCH) rc.bindTooltip(heatTip(x), {sticky:true, direction:'top'}).on('click', () => openSpot(p));
      rc.addTo(heatLayer);
    });
  });
  // Dokunmatikte kaydırma her dokunuşta ayrı karar verilir (ısı haritası üstünde mi?) — bkz. TOUCH dinleyicileri
  if (TOUCH && !state.scan.length) { map.dragging.enable(); scrubTip.hidden = true; }
  scheduleMask();
  // En iyi hücrelere ilk 3 balık baloncuğu: her tarama bölgesi için ayrı ayrı en iyi 5, bölge büyükse
  // (deniz alanının köşegeni 5 km+, ör. Tütünçiftlik–Gölcük ~6 km) en iyi 10. Baloncuklar birbirinin üstüne binmesin:
  // baloncuğun kendi boyutuna göre (~120×80 px) çakışan aday atlanır, sıradaki en iyi nokta denenir.
  // Tarama baloncukları önce yerleşir; mera baloncukları kalan boşluğa (drawSpots, en sonda)
  const chosen = [], groups = new Map(), taken = [];
  scored.filter(x => x.s != null && x.H.list.length).forEach(x => { const k = x.at || 0; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(x); });
  for (const list of groups.values()) {
    const b = L.latLngBounds(list.map(x => [x.S.p.lat, x.S.p.lng]));
    const want = map.distance(b.getSouthWest(), b.getNorthEast()) >= 5000 ? 10 : 5;
    let n = 0;
    for (const x of list.sort((a, c) => c.s - a.s)) {
      const cp = map.latLngToContainerPoint([x.S.p.lat, x.S.p.lng]);
      if (bubFits(cp, taken)) { taken.push(cp); chosen.push(x); n++; }
      if (n >= want) break;
    }
  }
  chosen.forEach(({S, H}) => L.marker([S.p.lat, S.p.lng], {icon: L.divIcon({className:'', iconSize:null,
    html: pinHtml(H, `<div class="muted" style="text-align:center">${Math.round(S.p.d)} m${S.p.shore != null ? ' · ' + shoreTxt(S.p.shore) : ''}</div>`)})})
    .addTo(scanLayer).on('click', () => openSpot(S.p)));
  scanBubbles = chosen.map(({S}) => [S.p.lat, S.p.lng]);
  drawSpots();
  heatLegend.update();
}
// Isı haritası hücresinin bilgisi (masaüstünde fareyle üzerine gelince, mobilde parmakla gezinirken)
function heatTip({S:{p}, H, s}){
  const top = state.target ? (s == null ? `${FISH_BY_ID[state.target].ad} beklenmez` : `🎯 ${FISH_BY_ID[state.target].ad}`)
                           : H.list.slice(0, 3).map(r => `${r.fish.ad} ${r.adj}`).join(' · ');
  return `<b>${s ?? '–'}</b> · ${top}<br>${p.dEst ? '~' : ''}${Math.round(p.d)} m${p.dEst ? ' (tahmini)' : ''}${p.shore != null ? ' · ' + shoreTxt(p.shore) : ''}${p.bt ? ' · ' + BOTTOM_TR[p.bt.t] + ' dip?' : ''}`;
}
// Dokunmatik ekran: ısı haritası açıkken tek parmakla gezdikçe parmağın üstünde bilgi kutusu (iki parmak kaydırır/yakınlaştırır)
const TOUCH = matchMedia('(pointer: coarse)').matches;   // ana giriş parmak (telefon/tablet); fareli dokunmatik dizüstü hariç
const scrubTip = L.DomUtil.create('div', 'scrubtip', map.getContainer());
scrubTip.hidden = true;
L.DomEvent.disableClickPropagation(scrubTip);
scrubTip.onclick = ev => { L.DomEvent.stop(ev); if (scrubTip._p) { scrubTip.hidden = true; openSpot(scrubTip._p); } };
function cellAt(ll){
  let best = null, bd = Infinity;
  for (const x of state.scan) {
    const p = x.S.p, [dLat, dLng] = p.cell || [0, 0];
    if (Math.abs(ll.lat - p.lat) > dLat / 2 || Math.abs(ll.lng - p.lng) > dLng / 2) continue;
    const d = Math.abs(ll.lat - p.lat) + Math.abs(ll.lng - p.lng);
    if (d < bd) { bd = d; best = x; }
  }
  return best;
}
function scrubAt(t){
  const r = map.getContainer().getBoundingClientRect(), pt = L.point(t.clientX - r.left, t.clientY - r.top);
  const x = maskVisible(t.clientX, t.clientY) && cellAt(map.containerPointToLatLng(pt));   // parmak karaya geçince kutu kapanır
  if (!x) { scrubTip.hidden = true; return; }
  scrubTip.innerHTML = heatTip({...x, s: tScore(x.H)}) + '<div class="go">Detay için dokun ›</div>';
  scrubTip._p = x.S.p; scrubTip.hidden = false;
  const w = scrubTip.offsetWidth, h = scrubTip.offsetHeight;
  scrubTip.style.left = clamp(pt.x - w / 2, 6, r.width - w - 6) + 'px';
  scrubTip.style.top = (pt.y - h - 34 < 60 ? pt.y + 34 : pt.y - h - 34) + 'px';   // parmağın üstünde (yer yoksa altında)
}
// Tek parmak ısı haritasının ÜSTÜNDE başlarsa değerler gezilir (harita kaymaz); dışında başlarsa harita normal kayar.
// İki parmak her zaman kaydırır/yakınlaştırır. Karar Leaflet'ten önce verilsin diye dokunuş başlangıcı yakalama evresinde dinlenir.
if (TOUCH) {
  const mc = map.getContainer();
  let scrubbing = false;
  const llOf = t => { const r = mc.getBoundingClientRect(); return map.containerPointToLatLng(L.point(t.clientX - r.left, t.clientY - r.top)); };
  mc.addEventListener('touchstart', ev => {
    if (ev.target.closest('.leaflet-control, .scrubtip, .leaflet-marker-icon')) return;
    const t0 = ev.touches[0];
    scrubbing = ev.touches.length === 1 && state.scan.length > 0 && !!cellAt(llOf(t0)) && maskVisible(t0.clientX, t0.clientY);
    if (scrubbing) { map.dragging.disable(); scrubAt(ev.touches[0]); }
    else { if (!map.dragging.enabled()) map.dragging.enable(); scrubTip.hidden = true; }
  }, {capture:true, passive:true});
  mc.addEventListener('touchmove', ev => {
    if (!scrubbing) return;
    if (ev.touches.length !== 1) { scrubbing = false; scrubTip.hidden = true; map.dragging.enable(); return; }
    if (ev.cancelable) ev.preventDefault();   // tarayıcı metin seçmesin / sayfayı kaydırmasın
    window.getSelection && window.getSelection().removeAllRanges();

// Haritanın alt/yan panelin kapatmadığı kısmı (kullanıcının gerçekten gördüğü su)
function visibleBounds(){
  const mr = map.getContainer().getBoundingClientRect(), pr = panel.getBoundingClientRect();
  let left = 0, top = 0, right = mr.width, bottom = mr.height;
  if (pr.width > 5 && pr.height > 5 && getComputedStyle(panel).display !== 'none') {
    if (pr.width >= mr.width * 0.8) bottom = Math.min(bottom, pr.top - mr.top);
    else if (pr.left - mr.left < mr.width / 2) left = Math.max(left, pr.right - mr.left);
    else right = Math.min(right, pr.left - mr.left);
  }
  if (bottom - top < 80 || right - left < 80) return map.getBounds();
  return L.latLngBounds(map.containerPointToLatLng([left, bottom]), map.containerPointToLatLng([right, top]));
}
// EMODnet: iki nokta arasında eşit aralıklı 1000 derinlik değeri (negatif = deniz, pozitif = kara) — tek istek
async function depthProfile(a, b){
  for (let k = 0; k < 3; k++) {
    try {
      const r = await fetch(`https://rest.emodnet-bathymetry.eu/depth_profile?geom=LINESTRING(${a.lng.toFixed(5)}%20${a.lat.toFixed(5)},${b.lng.toFixed(5)}%20${b.lat.toFixed(5)})`);
      if (r.ok) { const x = await r.json(); if (Array.isArray(x) && x.length > 10) return x; }
    } catch {}
    await sleep(600 * (k + 1));   // reddedilirse giderek daha uzun bekle
  }
  return null;
}
async function pool(tasks, n, onDone){
  const out = new Array(tasks.length); let i = 0, done = 0;
  await Promise.all(Array.from({length:n}, async () => {
    while (i < tasks.length) { const k = i++; out[k] = await tasks[k](); onDone && onDone(++done, tasks.length); }
  }));
  return out;
}

// kıyı çizgisi yatayda birkaç piksel, dikeyde şerit kalınlığı (~7 px) hassasiyetinde — karaya taşma ve boşluk kalmaz.
// Harita kafesi: hücreler her zoom için sabit bir kafese oturur (~28 px). Görünüm kaysa da aynı hücre aynı koordinata

function gridLattice(vb){

                        Math.ceil((Math.ceil(vb.getNorth() / dLat) - Math.floor(vb.getSouth() / dLat)) / 30));

      // Boğaz, liman içleri) derinlik bilinmiyor sayılır, aşağıda komşulardan ya da kıyıya uzaklıktan tahmin edilir.

        return;
      }
      const nb = N8.map(([i, j]) => at[(p.r + i) + ',' + (p.c + j)]).filter(Boolean).map(q => q.d);
