  if (!rec || Date.now() - rec.at > GRID_TTL) rec = {at:Date.now(), cells:{}};
  const missing = [];
  for (let r = 0; r < box.rows; r++) for (let c = 0; c < box.cols; c++) if (force || !(gk(r, c) in rec.cells)) missing.push([r, c]);
  // Eksik hücreler kutulara ayrılır: tamamen eksik satır grupları (yukarı/aşağı kaydırma) + kalanların çerçevesi (yana kaydırma)
  const boxes = [], fullRow = r => force || missing.filter(m => m[0] === r).length === box.cols;
  const rowsFull = [...new Set(missing.map(m => m[0]))].filter(fullRow).sort((a, b) => a - b);
  for (let i = 0; i < rowsFull.length; i++) {
    let j = i; while (j + 1 < rowsFull.length && rowsFull[j + 1] === rowsFull[j] + 1) j++;
    boxes.push([rowsFull[i], rowsFull[j], 0, box.cols - 1]); i = j;
  }
  const rest = missing.filter(m => !rowsFull.includes(m[0]));
  if (rest.length) boxes.push([Math.min(...rest.map(m => m[0])), Math.max(...rest.map(m => m[0])), Math.min(...rest.map(m => m[1])), Math.max(...rest.map(m => m[1]))]);
  // Kutu her yandan 1 hücre payla taranır (komşuya dayalı derinlik tahmini ve kıyı tamamlama kutu kenarında da doğru çalışsın);
  // yalnız eksik hücreler kaydedilir, önceden kayıtlı hücreler değişmez
  const eps = dLat * 1e-6, need = new Set(missing.map(([r, c]) => gk(r, c)));
  const m = missing.length === box.rows * box.cols ? 0 : 1;   // tamamen yeni bölgede pay gereksiz (kayıtlı komşu yok)
  for (const [r1, r2, c1, c2] of boxes) {
    const bb = L.latLngBounds([box.S0 + (r1 - m) * dLat + eps, box.W0 + (c1 - m) * dLng + eps], [box.S0 + (r2 + 1 + m) * dLat - eps, box.W0 + (c2 + 1 + m) * dLng - eps]);
    const g = await heatGrid(bb, step, lat);
    const br = Math.round(g.S0 / dLat) - gr0, bc = Math.round(g.W0 / dLng) - gc0;
    for (let r = 0; r < g.rows; r++) for (let c = 0; c < g.cols; c++) { const k = gk(br + r, bc + c); if (need.has(k)) rec.cells[k] = 0; }   // 0 = kara/deniz yok
    g.cells.forEach(({r, c, lat:la, lng, d, shore, boxes:bx, est}) => { const k = gk(br + r, bc + c); if (need.has(k)) rec.cells[k] = {lat:la, lng, d, shore, boxes:bx, est}; });
  }
  if (boxes.length) idb.set(key, rec);
  const cells = [];
  for (let r = 0; r < box.rows; r++) for (let c = 0; c < box.cols; c++) { const v = rec.cells[gk(r, c)]; if (v) cells.push({...v, r, c}); }
  return {cells, rows:box.rows, cols:box.cols, dLat, dLng, ...box, at:rec.at, fresh:missing.length, total:box.rows * box.cols, lk:lat.key, gr0, gc0};
}

// ---------- Tara: seçili il (hedef balık varsa tüm il) — deniz + göl/baraj/akarsu ----------
async function scan(){
  if (!state.il) { alert('Önce yukarıdaki kutudan bir il (bölge) seçin, sonra Tara’ya basın.'); return; }
  const tf = state.target ? FISH_BY_ID[state.target] : null;
  const btn = $('scanBtn'), step = t => { btn.innerHTML = `<span class="spin"></span>${t}`; scanBadge.set('Taranıyor · ' + t); };
  if (state.scanning) return;   // aynı anda ikinci tarama başlamasın (kota iki kat harcanırdı)
  state.scanning = true; if ($('mapScanBtn')) $('mapScanBtn').disabled = true;
  btn.disabled = true; step('hazırlanıyor…'); state.scanFrom = null; state.scanFresh = null;
  try {
    // Harita kaydırılmaz: deniz ısı haritası her zaman ekranda görünen suya çıkarılır (panel kapatılır ki su görünsün).
    // Hedef balık seçiliyse kayıtlı noktalar ilçe (seçiliyse) ya da il genelinde puanlanır ve listeye gelir.
    if (isMobile() && panel.dataset.state !== 'min') { sheet('min'); await sleep(350); }
    const bounds = visibleBounds();
    // 1) Kayıtlı noktalar (deniz + tatlı su)
    let spots = tf ? SPOTS.filter(s => s.il === state.il && (!state.ilce || s.ic === state.ilce) || bounds.contains([s.lat, s.lng]))
                   : SPOTS.filter(s => bounds.contains([s.lat, s.lng]));
    spots = spots.filter(spotVisible);
    if (!freshOn()) spots = spots.filter(s => s.w === 'deniz');   // tatlı su filtreden seçilmedikçe taranmaz
    if (tf) spots = spots.filter(s => tf.water === 'tuzlu' ? s.w === 'deniz' : (s.w !== 'deniz' && tf.hab.includes(s.w)));
    if (!tf && spots.length > 80) spots = spots.filter(s => !s.auto || s.w !== 'dere').slice(0, 80);
    // 2) Görünen deniz: ızgara hücreleri (derinlik + kıyı uzaklığı) ve onlara hava/deniz verisi sağlayacak birkaç çapa noktası
    let cells = [], grid = null;
    const sea = [];
    if ((!tf || tf.water === 'tuzlu') && state.filter !== 'tatli') {
      // Kayıtlı hücreler kullanılır, yalnız eksikler taranır (hava verisi ayrıca 10 dk önbellekte)
      step('Derinlik…');
      grid = await cachedGrid(bounds, step, state.forceScan);
      state.forceScan = false;
      state.scanFrom = grid.at; state.scanFresh = grid.fresh; state.scanTotal = grid.total;
      // Açık denizde (Karadeniz, açık Marmara/Ege) yalnız kıyıdan en fazla 1 km; kapalı ve dar sularda (İzmit Körfezi,
      // İstanbul Boğazı) tamamı — körfezin ortası boş kalmasın
      cells = grid.cells.filter(c => ['I', 'B'].includes(seaZone(c.lat, c.lng)) || (c.shore != null && c.shore <= SHORE_MAX));
      // Hücrenin kara yönü: 2 hücre çevresindeki kafeste su olmayan (kara) komşuların ortalama yönü (satır kuzeye, sütun doğuya artar)
      const wet = new Set(grid.cells.map(c => c.r + ',' + c.c));
      cells.forEach(c => {
        let x = 0, y = 0;
        for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
          const r = c.r + dr, k = c.c + dc;
          if ((dr || dc) && r >= 0 && r < grid.rows && k >= 0 && k < grid.cols && !wet.has(r + ',' + k)) { const n = Math.hypot(dr, dc); x += dc / n; y += dr / n; }
        }
        c.lb = vecBearing(x, y);
      });
      // Hava görünen alanda az değişir: alan 3×2 parçaya bölünür, her parçadaki en açık hücre çapa olur (en fazla 6 sorgu)
      for (let i = 0; i < 2; i++) for (let j = 0; j < 3; j++) {
        const inPart = cells.filter(c => Math.floor(c.r / grid.rows * 2) === i && Math.floor(c.c / grid.cols * 3) === j);
        if (!inPart.length) continue;
        const cl = grid.S0 + (i + .5) * (grid.N0 - grid.S0) / 2, cg = grid.W0 + (j + .5) * (grid.E0 - grid.W0) / 3;
        const a = inPart.reduce((b, c) => Math.hypot(c.lat - cl, c.lng - cg) < Math.hypot(b.lat - cl, b.lng - cg) ? c : b);
        sea.push({n:'Açık deniz', w:'deniz', lat:a.lat, lng:a.lng, d:a.d, f:[], custom:true, anchor:true});
      }
    }
    if (!spots.length && !cells.length) {
      alert(tf ? `${state.il} ilinde ${tf.ad} için uygun nokta bulunamadı (${tf.water === 'tatli' ? 'tatlı su' : 'deniz'} balığı).` : 'Görünen alanda taranacak nokta yok. Haritayı kaydır ya da yakınlaş.');
      return;
    }
    // 3) Hava/su verisi ve puanlama (Open-Meteo sınırı için 25'erli)
    const all = [...spots, ...sea];
    const series = [];
    for (let i = 0; i < all.length; i += 25) {
      step(`Hava/su verisi ${Math.min(i + 25, all.length)}/${all.length}…`);
      let got = null;
      // Dakikalık sınıra takılırsa hata vermeden bekleyip tekrar dener (sınır ~1 dakikada açılır)
      for (let t = 0; t < 4 && !got; t++) {
        try { got = await fetchSeries(all.slice(i, i + 25)); }
        catch (e) {
          if (e.daily || t === 3) throw e;
          for (let w = 20; w > 0; w--) { step(`Servis sınırı, bekleniyor ${w} sn…`); await sleep(1000); }
        }
      }
      if (!got) throw new Error('Hava verisi alınamadı, biraz sonra tekrar dene.');
      series.push(...got);
      if (all.length > 50) await sleep(1500);
    }
    // Önceki taramalar (Temizle ile gizlenenler dahil) 10 dk ekranda kalır: İzmit'ten sonra Tütünçiftlik taranınca İzmit
    // silinmez. Yeni taranan alanın içindeki eski hücreler yenileriyle değişir.
    const nb = grid ? L.latLngBounds([grid.S0, grid.W0], [grid.N0, grid.E0]) : null;
    state.scan = [...state.scan, ...(state.scanHidden || [])].filter(x => Date.now() - (x.at || 0) < SCAN_SHOW && !(nb && nb.contains([x.S.p.lat, x.S.p.lng])));
    state.scanHidden = [];
    const anchors = [], scanAt = Date.now();
    series.forEach(S => { if (S.p.anchor) anchors.push(S); else state.ratings[S.p.n] = hourScore(S, S.nowIdx); });
    // Her hücre: kendi derinliği ve kıyı uzaklığı + en yakın 3 çapanın hava/deniz verisi (uzaklığa göre ağırlıklı;
    // çapa sınırlarında puan birden sıçramasın, ör. fırtına hücresinin kenarı yumuşak geçsin)
    if (anchors.length) cells.forEach(c => {
      const p = {n:'Açık deniz noktası', w:'deniz', lat:c.lat, lng:c.lng, d:Math.max(0.5, Math.round(c.d * 10) / 10), dNote: c.est ? 'tahmini (EMODnet burada boş)' : 'EMODnet', dEst:c.est,
        shore:c.shore, lb:c.lb, bt: bottomFromSlope(c.d, c.shore, c.est), f:[], custom:true, cell:[grid.dLat, grid.dLng], rc:[grid.gr0 + c.r, grid.gc0 + c.c], lk:grid.lk, boxes:c.boxes};
      const near = anchors.map(A => ({A, d: Math.hypot(A.p.lat - c.lat, (A.p.lng - c.lng) * Math.cos(c.lat * Math.PI / 180))}))
        .sort((x, y) => x.d - y.d);   // tüm çapalar: ağırlıklar uzaklıkla sürekli değişir, sınırda sıçrama olmaz
      p.chl = (near.find(x => x.A.p.chl) || {A:{p:{}}}).A.p.chl || null;   // klorofil ~5 km ölçekli: en yakın verili çapadan
      const Hs = near.map(({A, d}) => ({H: hourScore({...A, p}, A.nowIdx), w: 1 / (d * d + 1e-6)}));
      const W = Hs.reduce((a, x) => a + x.w, 0), H = Hs[0].H;
      if (Hs.length > 1) {
        const adj = {};
        Hs.forEach(({H: h, w}) => h.list.forEach(r => adj[r.fish.id] = (adj[r.fish.id] || 0) + r.adj * w));
        H.list.forEach(r => r.adj = Math.round(adj[r.fish.id] / W));
        H.list.sort((a, b) => b.adj - a.adj);
        H.top = H.list.slice(0, 3);
        H.score = Math.round(Hs.reduce((a, x) => a + x.H.score * x.w, 0) / W);
      }
      state.scan.push({S: {...near[0].A, p}, H, at:scanAt});   // at: aynı taramanın hücreleri aynı zamanı taşır (bölge grubu)
    });
    state.scanZoom = map.getZoom();
    drawSpots(); drawScan(); renderSpotList(); showTab('noktalar', false);
    const best = series.map(S => ({S, s: tScore(hourScore(S, S.nowIdx))})).filter(x => x.s != null).sort((a, b) => b.s - a.s)[0];
    if (best && tf) $('tab-noktalar').insertAdjacentHTML('afterbegin',
      `<div class="card" style="border-color:var(--accent)"><h2>🔍 ${state.il} · ${tf.ad} taraması</h2>
        <p class="hint">${state.ilce || state.il} genelinde ${spots.length} kayıtlı nokta${state.scan.length ? ` + görünen alanda ${state.scan.length} deniz hücresi` : ''} tarandı. Şu an en iyi:
        <b>${best.S.p.custom ? 'açık deniz noktası (haritada)' : best.S.p.n}</b> <b style="color:${scoreColor(best.s)}">${best.s}</b>.
        Haftalık en iyi gün/saat için ⏱️ En verimli saatler.</p></div>`);
  } catch (err) { alert('Tarama başarısız: ' + err.message); }
  finally { btn.disabled = false; btn.textContent = '🔍 Tara'; scanBadge.set(''); state.scanning = false; if ($('mapScanBtn')) $('mapScanBtn').disabled = false; }
}

// =====================================================================
//  HAFTALIK FIRSATLAR (tüm noktalar × 7 gün × saat saat)
// =====================================================================
const sleep = ms => new Promise(r => setTimeout(r, ms));
const weekUI = {water:'hepsi', il:'', items:[]};

// Filtreye uyan noktalar (haftalık ekran)
function weekSpots(){
  // Hedef tatlı su balığıysa "yalnız deniz" seçimi tatlı suya döner (yoksa liste boş kalırdı)
  const tw = state.target && FISH_BY_ID[state.target].water === 'tatli' && weekUI.water === 'deniz' ? 'tatli' : weekUI.water;
  return SPOTS.filter(s => !(tw === 'deniz' && s.w !== 'deniz') && !(tw === 'tatli' && s.w === 'deniz') && !(weekUI.il && s.il !== weekUI.il));
}
// Sadece önbellekte olmayan noktaların verisini çeker (Open-Meteo dakika sınırına takılmamak için yavaşça)
async function loadWeek(spots, onProg){
  if (!state.week || Date.now() - state.week.at > SERIES_TTL) state.week = {map:new Map(), at:Date.now()};
  const need = spots.filter(s => !state.week.map.has(s.n));
  const chunks = [];
  for (let i = 0; i < need.length; i += 25) chunks.push(need.slice(i, i + 25));
  const all = [];
  for (const [k, c] of chunks.entries()) {
    let got = null;
    for (let t = 0; t < 4 && !got; t++) { try { got = await fetchSeries(c); } catch (e) { if (e.daily || t === 3) throw e; onProg(-1); await sleep(15000); } }
    all.push(...got);
    onProg((k + 1) / chunks.length * 0.7);
    if (chunks.length > 4) await sleep(2500);
  }
  // Her nokta için saatlik tür puanları (bellekte kompakt tutulur)
  for (const [k, S] of all.entries()) {
    const n = S.F.hourly.time.length - S.nowIdx, times = [], sp = {};
    const best = new Int16Array(n).fill(-1), bestId = new Array(n).fill(null);
    for (let j = 0; j < n; j++) {
      const H = hourScore(S, S.nowIdx + j);
      times.push(H.e.time);
      for (const r of H.list) {
        (sp[r.fish.id] ||= new Int16Array(n).fill(-1))[j] = r.adj;
        if (r.adj > best[j]) { best[j] = r.adj; bestId[j] = r.fish.id; }
      }
    }
    state.week.map.set(S.p.n, {S, times, sp, best, bestId});
    if (k % 8 === 0) { onProg(0.7 + 0.3 * k / all.length); await sleep(0); }
  }
}
const weekRes = () => weekSpots().map(s => state.week.map.get(s.n)).filter(Boolean);

// Her nokta × gün için en iyi 1–3 saatlik pencere
function weekOpps(){
  const tgt = state.target, out = [];
  for (const R of weekRes()) {
    const s = R.S.p;
    const arr = tgt ? R.sp[tgt] : R.best;
    if (!arr) continue;
    const days = {};
    R.times.forEach((t, j) => (days[t.slice(0, 10)] ||= []).push(j));
    for (const [d, js] of Object.entries(days)) {
      let top = -1, bj = -1;
      for (const j of js) if (arr[j] > top) { top = arr[j]; bj = j; }
      if (top < 0) continue;
      let a = bj, b = bj;
      while (b - a < 2) {
        const okL = a - 1 >= js[0] && arr[a-1] >= top - 8, okR = b + 1 <= js[js.length-1] && arr[b+1] >= top - 8;
        if (okR && (!okL || arr[b+1] >= arr[a-1])) b++; else if (okL) a--; else break;
      }
      let sum = 0; for (let x = a; x <= b; x++) sum += arr[x];
      out.push({R, s, day:d, a, b, peak:bj, score:Math.round(sum / (b - a + 1)), fid: tgt || R.bestId[bj]});
    }
  }
  return out.sort((x, y) => y.score - x.score);
}

function oppRow(o, rank){
  const f = FISH_BY_ID[o.fid], H = hourScore(o.R.S, o.R.S.nowIdx + o.peak);
  const r = H.list.find(x => x.fish.id === o.fid);
  const bait = r ? pickBaits(f, H.e, r.score)[0].n : '';
  const end = String((+o.R.times[o.b].slice(11, 13) + 1) % 24).padStart(2, '0') + ':00';
  weekUI.items.push(o);
  return `<button class="opp" data-open="${weekUI.items.length - 1}">
    ${rank != null ? `<span class="rk">${rank}</span>` : ''}${fimg(o.fid, 'lg')}
    <span class="mid"><span class="nm">${f.ad} · ${o.s.n}</span><br>
      <span class="sub">${dayLabel(o.R.times[o.a])} ${hh(o.R.times[o.a])}–${end} · ${o.s.il}/${o.s.ic} · ${W_NAMES[o.s.w]}</span><br>
      <span class="sub">🪱 ${bait}${H.e.wind > 30 ? ' · ⚠️ rüzgâr ' + Math.round(H.e.wind) + ' km/s' : ''}</span></span>
    <span class="sc" style="color:${scoreColor(o.score)}">${o.score}</span></button>`;
}

function renderWeekly(){
  const box = $('wBody');
  if (!box || !state.week || weekBusy) return;
  weekUI.items = [];
  const opps = weekOpps(), tgt = state.target ? FISH_BY_ID[state.target] : null;
  let html = '';
  if (!opps.length) { box.innerHTML = `<p class="hint">Bu filtrelerle fırsat bulunamadı${tgt ? ` (${tgt.ad} seçili su tipinde/ilde beklenmiyor ya da av yasağında)` : ''}.</p>`; return; }

  if (!tgt) {
    // Her tür için haftanın en iyi zamanı ve yeri
    const bySp = {};
    for (const R of weekRes()) {
      const s = R.S.p;
      for (const [id, arr] of Object.entries(R.sp)) {
        let top = -1, bj = -1; arr.forEach((v, j) => { if (v > top) { top = v; bj = j; } });
        if (top >= 0 && (!bySp[id] || top > bySp[id].score)) bySp[id] = {R, s, day:R.times[bj].slice(0, 10), a:bj, b:bj, peak:bj, score:top, fid:id};
      }
    }
    const spList = Object.values(bySp).sort((x, y) => y.score - x.score);
    html += `<div class="gsec"><h2>🐟 Balık türlerine göre haftanın en iyisi</h2><p class="note">Her tür için 7 gün içindeki en yüksek puanlı yer ve saat. Bir türe odaklanmak için yukarıdan seç.</p>
      ${spList.map((o, k) => oppRow(o, k + 1)).join('')}</div>`;
  }

  const top = [], perSpot = {};
  for (const o of opps) { if ((perSpot[o.s.n] = (perSpot[o.s.n] || 0) + 1) <= 2) top.push(o); if (top.length >= 10) break; }
  html += `<div class="gsec"><h2>🏆 ${tgt ? tgt.ad + ' için ' : ''}haftanın en iyi 10 fırsatı</h2>${top.map((o, k) => oppRow(o, k + 1)).join('')}</div>`;

  const byDay = {};
  opps.forEach(o => (byDay[o.day] ||= []).push(o));
  html += `<div class="gsec"><h2>📅 Gün gün en iyi 3 ${tgt ? '(' + tgt.ad + ')' : ''}</h2>`;
  for (const d of Object.keys(byDay).sort()) {
    html += `<h4 style="margin:10px 0 6px">${dayLabel(d + 'T00')}</h4>${byDay[d].slice(0, 3).map(o => oppRow(o)).join('')}`;
  }
  html += `</div><p class="note">Puan: türün o saatteki olasılığı × rüzgâr, yağış, dalga, ay ve gün saati etkisi. 4. günden sonrası hava tahmini belirsizleşir.</p>`;
  box.innerHTML = html;
  hydrate(box);
}

// Hedef balık listesi: deniz ve tatlı su ayrı gruplar, her grup kendi içinde Türkçe alfabetik
const trSort = (a, b) => a.localeCompare(b, 'tr');
function targetOptions(){
  const opts = list => [...list].sort((a, b) => trSort(a.ad, b.ad)).map(f => `<option value="${f.id}">${f.ad}</option>`).join('');
  return `<option value="">🎯 Tüm balıklar</option>
    <optgroup label="🌊 Deniz">${opts(SALT)}</optgroup>
    <optgroup label="🏞️ Tatlı su">${opts(FRESH)}</optgroup>`;
}

async function openWeekly(force){
  openModal(`<h3 style="margin:0">⏱️ En verimli saatler</h3>

    </div>
    <div class="sub" id="wMeta"></div>
    <div id="wBody"></div>`);

  $('wIl').onchange = ev => { weekUI.il = ev.target.value; refreshWeekly(); };
  $('wBody').onclick = ev => {
    const b = ev.target.closest('[data-open]'); if (!b) return;
    const o = weekUI.items[+b.dataset.open];
    closeModal(); map.flyTo([o.s.lat, o.s.lng], 12, {duration:0.6}); openSpot(o.s, o.R.times[o.peak]);
  };
  if (force) state.week = null;
  refreshWeekly();
}

let weekBusy = false;
async function refreshWeekly(){
  if (!$('wBody') || weekBusy) return;
  const spots = weekSpots();
  const meta = () => { if (!$('wMeta') || !state.week) return; const t = new Date(state.week.at);
    $('wMeta').innerHTML = `${spots.length} nokta · güncellendi ${t.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'})} · <button class="linkbtn" id="wRefresh">yenile</button>`;
    $('wRefresh').onclick = () => openWeekly(true); };
  const fresh = state.week && Date.now() - state.week.at < 60 * 60000;
  if (fresh && spots.every(s => state.week.map.has(s.n))) { meta(); renderWeekly(); return; }
  const need = fresh ? spots.filter(s => !state.week.map.has(s.n)).length : spots.length;
  // Çok sayıda nokta ücretsiz hava servisinin günlük kotasından ciddi pay yer: önce il seçmeyi öner
  if (need > 150 && !weekUI.allOk) {
    $('wBody').innerHTML = `<div class="card"><h2>${need} nokta hesaplanacak</h2>
      <p class="hint">Tüm bölgeyi hesaplamak ücretsiz hava servisinin günlük sorgu hakkından büyük pay kullanır ve 1–2 dakika sürer.
      Yukarıdan bir <b>il</b> ya da <b>su tipi</b> seçersen çok daha hızlı olur.</p>
      <div class="tags" style="margin-top:10px"><button id="wAll">Yine de hepsini hesapla</button></div></div>`;
    $('wAll').onclick = () => { weekUI.allOk = true; refreshWeekly(); };
    return;
  }
  $('wBody').innerHTML = `<div class="card"><span class="spin"></span><span id="wProgTxt">${need} nokta için 7 günlük hava ve su verisi çekiliyor…
    ${need > 150 ? '<br><span class="sub">Çok nokta var, 1–2 dakika sürebilir. İl veya su tipi seçersen hızlanır.</span>' : ''}</span>
    <div class="progress"><i id="wProg" style="width:2%"></i></div></div>`;
  weekBusy = true;
  try {
    await loadWeek(spots, p => {
      const tx = $('wProgTxt');
      if (p < 0) { if (tx) tx.textContent = 'Hava servisi kısa bir bekleme istedi, birazdan devam ediyor…'; return; }
      const bar = $('wProg'); if (bar) bar.style.width = Math.round(p * 100) + '%';
      if (tx && p > 0.7) tx.textContent = 'Saat saat puanlar hesaplanıyor…';
    });
    weekBusy = false;
    if (!modal.hidden && $('wBody')) {
      // Hesap sürerken filtre değiştiyse eksikleri tamamla
      if (weekSpots().some(s => !state.week.map.has(s.n))) return refreshWeekly();
      meta(); renderWeekly();
    }
  } catch (err) {
    weekBusy = false;
    if ($('wBody')) $('wBody').innerHTML = `<div class="card"><b>Hata:</b> ${err.message}</div>`;
  }
}

function setTarget(v){
  state.target = v;
  document.querySelectorAll('#targetSel, .tsel').forEach(s => s.value = v);
  drawSpots(); drawScan(); renderSpotList();
  if (state.hours) { renderDetail(); renderWeek(); }
  if (!modal.hidden && $('wBody')) renderWeekly();
}

// ---------- Tam ekran ----------
function setFs(on){
  document.body.classList.toggle('fs', on);
  const el = document.documentElement;
  try {
    if (on && !document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
    if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  } catch {}
  $('fsBtn').innerHTML = on ? '✕<span class="lbl"> Tam ekrandan çık</span>' : '⛶<span class="lbl"> Tam ekran</span>';
  $('fsBtn').title = on ? 'Tam ekrandan çık' : 'Tam ekran';
  setTimeout(() => map.invalidateSize(), 250);
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('fs')) setFs(false); });

// ---------- Olaylar ----------
// Mobil üst çubuk: açık panel varsa haritaya dokunmak sadece paneli kapatır
function closeBars(){ ['filters','menu','filterPill','menuBtn'].forEach(id => $(id).classList.remove('open')); document.body.classList.remove('bars-open'); }
const barsOpen = () => $('filters').classList.contains('open') || $('menu').classList.contains('open');
map.on('click', ev => {
  if (barsOpen()) { closeBars(); return; }
  // Dokunmatikte ısı haritası üzerine dokunmak bilgi kutusunu gösterir (detay, kutuya dokununca açılır)
  const oe = ev.originalEvent;
  if (TOUCH && state.scan.length && cellAt(ev.latlng) && (!oe || maskVisible(oe.clientX, oe.clientY))) return;
  clickPoint(ev.latlng);
});
// Balık adına/fotoğrafına dokununca rehber penceresi (kart içindeki tıklamadan önce yakalanır)
document.addEventListener('click', ev => {
  // Google rozeti: kartın kendi tıklamasını tetiklemeden bağlantıyı aç
  if (ev.target.closest('.gbadge')) { ev.stopPropagation(); return; }
  const fe = ev.target.closest('[data-fish]'), se = ev.target.closest('[data-spot]');
  if (fe) { ev.stopPropagation(); ev.preventDefault(); openFish(fe.dataset.fish); }
  else if (se) {
    ev.stopPropagation(); ev.preventDefault();
    goSpot(SPOTS.find(x => x.n === se.dataset.spot));
  }
}, true);
$('mclose').onclick = closeModal;
modal.addEventListener('click', ev => { if (ev.target === modal) closeModal(); });
addEventListener('keydown', ev => { if (ev.key === 'Escape') closeModal(); });
$('guideBtn').onclick = openGuide;
$('targetSel').innerHTML = targetOptions();
$('targetSel').onchange = ev => setTarget(ev.target.value);
$('bellBtn').onclick = () => { closeBars(); openWeekly(); };
// Filtre paneli ya da menü açıkken alt panel gizlenir (üst üste binmesin), kapanınca geri gelir
$('menuBtn').onclick = () => { const o = !$('menu').classList.contains('open'); closeBars(); $('menu').classList.toggle('open', o); $('menuBtn').classList.toggle('open', o); document.body.classList.toggle('bars-open', o); };
$('filterPill').onclick = () => { const o = !$('filters').classList.contains('open'); closeBars(); $('filters').classList.toggle('open', o); $('filterPill').classList.toggle('open', o); document.body.classList.toggle('bars-open', o); };
$('menu').addEventListener('click', ev => { if (ev.target.closest('#menu > button')) closeBars(); });
$('fDone').onclick = closeBars;
$('fScan').onclick = () => { closeBars(); scan(); };
// Filtre özeti: "📍 Kocaeli / Kandıra" + "🎯 Sazan · Tatlı su"
function updatePill(){
  $('pillMain').textContent = '📍 ' + (state.il ? state.il + (state.ilce ? ' / ' + state.ilce : '') : 'Tüm bölge');
  $('pillSub').textContent = (state.target ? '🎯 ' + FISH_BY_ID[state.target].ad : 'Tüm balıklar') + ' · ' +
    {hepsi:'Deniz + tatlı su', deniz:'🌊 Deniz', tatli:'🏞️ Tatlı su'}[state.filter];
}
['ilSel','ilceSel','targetSel'].forEach(id => $(id).addEventListener('change', updatePill));
['ilSel','ilceSel'].forEach(id => $(id).addEventListener('change', () => { renderPopular(); updateLabels(); }));
$('typeChips').addEventListener('click', () => setTimeout(() => { updatePill(); renderPopular(); updateLabels(); }));
// Nokta arama: listeden seçince ya da Enter'a basınca
const doSearch = () => {
  const s = findSpot($('spotSearch').value);
  if (s) { $('spotSearch').value = ''; $('spotSearch').blur(); goSpot(s); }
  else if ($('spotSearch').value.trim()) alert(`${state.ilce || state.il || 'Bölgede'} bu isimde kayıtlı nokta bulunamadı.${state.il ? ' Başka yerlerde aramak için il/ilçe seçimini kaldır.' : ''} Haritada istediğin yere dokunarak da analiz yapabilirsin.`);
};
$('spotSearch').addEventListener('change', () => { if (SPOTS.some(s => s.n === $('spotSearch').value)) doSearch(); });
$('spotSearch').addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); doSearch(); } });
renderPopular();
const _setTarget = setTarget;
setTarget = v => { _setTarget(v); updatePill(); };
updatePill();
$('scanBtn').onclick = scan;
$('rateBtn').onclick = rateSpots;
$('fsBtn').onclick = () => setFs(!document.body.classList.contains('fs'));
$('locBtn').onclick = () => {
  if (!navigator.geolocation) return alert('Tarayıcın konum desteği vermiyor.');
  navigator.geolocation.getCurrentPosition(p => {
    const ll = L.latLng(p.coords.latitude, p.coords.longitude);
    if (!REGION.contains(ll)) return alert('Konumun Marmara / Batı Karadeniz bölgesi dışında.');
    map.flyTo(ll, 12); clickPoint(ll);
  }, () => alert('Konum alınamadı (izin verilmedi ya da sayfa güvenli bağlantıda açılmadı).'));
};
addEventListener('resize', () => map.invalidateSize());

drawSpots(); welcome(); renderSpotList();
</script>
</body>
</html>
